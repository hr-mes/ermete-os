name: Enable KVM for the runner user
description: >-
  La regola udev che GitHub documenta per la virtualizzazione accelerata sui runner
  Linux: /dev/kvm nasce 0660 root:kvm e il runner non e' nel gruppo. `trigger` accoda
  l'evento e torna subito, `settle` aspetta che udevd lo abbia applicato, altrimenti il
  test vede ancora i permessi vecchi.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        sudo udevadm settle
        ls -l /dev/kvm
        test -w /dev/kvm
