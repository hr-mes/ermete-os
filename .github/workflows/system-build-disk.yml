---
name: 💾 System Disk/ISO Build

on:
  workflow_dispatch:
    inputs:
      upload-to-s3:
        description: "Upload to S3"
        required: false
        default: false
        type: boolean
      platform:
        required: true
        type: choice
        options:
          - amd64
          - arm64
  pull_request:
    branches:
      - main
    paths:
      - 'system/disk_config/disk.toml'
      - 'system/disk_config/iso.toml'
      - '.github/workflows/system-build-disk.yml'

env:
  IMAGE_NAME: "ermete-os-system"
  IMAGE_REGISTRY: "ghcr.io/hr-mes"
  DEFAULT_TAG: "latest"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_iso:
    name: 💿 Generate ${{ matrix.disk-type }}
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        disk-type: ["qcow2", "anaconda-iso"]
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: ⚙️ Prepare environment
        working-directory: system
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          DISK_TYPE=$(echo "${{ matrix.disk-type }}" | tr ' ' '-')
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "DISK_TYPE=${DISK_TYPE}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}

      - name: 🧹 Maximize build space
        if: github.event_name != 'workflow_dispatch' || inputs.platform != 'arm64'
        uses: ublue-os/remove-unwanted-software@v9
        with:
          remove-codeql: true

      - name: 📥 Checkout source
        uses: actions/checkout@v4

      - name: 🏗️ Build disk images
        id: build
        working-directory: system
        uses: osbuild/bootc-image-builder-action@v0.0.2
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ${{ matrix.disk-type == 'anaconda-iso' && './disk_config/iso.toml' || './disk_config/disk.toml' }}
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: ${{ matrix.disk-type }}
          additional-args: --use-librepo=True --rootfs=btrfs

      - name: 📦 Upload disk images to Artifacts
        if: (github.event_name != 'workflow_dispatch' || inputs.upload-to-s3 != true) && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ermete-os-${{ matrix.disk-type }}
          path: system/${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

  publish_s3:
    name: ☁️ Publish to AWS S3
    needs: build_iso
    if: github.event_name == 'workflow_dispatch' && inputs.upload-to-s3 == true && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 🧪 Enable Nested Virtualization & Fast QEMU KVM Boot Test
        shell: bash
        run: |
          echo "=> Enabling Nested Virtualization (QEMU / KVM)..."
          sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils libguestfs-tools
          sudo modprobe kvm || true
          sudo modprobe kvm_intel || sudo modprobe kvm_amd || true
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            KVM_FLAG="-enable-kvm"
            echo "KVM nested virtualization is active."
          else
            KVM_FLAG=""
            echo "WARNING: /dev/kvm not found, using TCG acceleration."
          fi

          QCOW_FILE=$(find artifacts -name "*.qcow2" | head -n 1)
          if [ -n "$QCOW_FILE" ]; then
            echo "=> Found qcow2 disk image: $QCOW_FILE"
            mkdir -p /tmp/boot_test
            echo "=> Extracting kernel & initramfs for fast kernel boot test..."
            guestfish --ro -a "$QCOW_FILE" -m /dev/sda4:/ copy-out /boot /tmp/boot_test/ 2>/dev/null || \
            virt-copy-out -a "$QCOW_FILE" /boot /tmp/boot_test/ 2>/dev/null || true

            KERNEL_BIN=$(find /tmp/boot_test -name "vmlinuz*" 2>/dev/null | head -n 1)
            INITRD_BIN=$(find /tmp/boot_test -name "initramfs*" 2>/dev/null | head -n 1)

            if [ -n "$KERNEL_BIN" ] && [ -n "$INITRD_BIN" ]; then
              echo "=> Executing fast boot test: qemu-system-x86_64 -m 2G -kernel $KERNEL_BIN"
              timeout 30s qemu-system-x86_64 ${KVM_FLAG} -m 2G -smp 2 \
                -kernel "$KERNEL_BIN" \
                -initrd "$INITRD_BIN" \
                -append "console=ttyS0 panic=1 quiet" \
                -drive file="$QCOW_FILE",if=virtio,format=qcow2 \
                -nographic -serial mon:stdio -no-reboot || true
            else
              echo "=> Executing direct QEMU boot test: qemu-system-x86_64 -m 2G -hda $QCOW_FILE"
              timeout 30s qemu-system-x86_64 ${KVM_FLAG} -m 2G -smp 2 \
                -drive file="$QCOW_FILE",if=virtio,format=qcow2 \
                -nographic -serial mon:stdio -no-reboot || true
            fi
            echo "=> Fast QEMU boot test completed."
          else
            echo "No qcow2 image found in artifacts, skipping boot test."
          fi

      - name: 🚀 Upload to S3 Bucket
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy artifacts/ S3:${{ secrets.S3_BUCKET_NAME }}
