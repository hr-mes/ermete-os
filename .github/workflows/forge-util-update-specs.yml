name: ⚙️ Forge Auto-Update Specs

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    working-directory: forge

jobs:
  update-specs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}
          
      - name: "🛡️ Zero-Trust Autonomous Dependency Injector"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== 🤖 Starting Python Zero-Trust Updater ==="
          python3 scripts/zero_trust_updater.py

      - name: Create Pull Request
        if: env.updates == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}
          commit-message: "chore(deps): auto-update spec versions and vendor offline tarballs (Zero-Trust)"
          title: "chore(deps): auto-update specs & vendor dependencies"
          branch: "chore/update-specs-zero-trust"
          base: "main"
          delete-branch: true
