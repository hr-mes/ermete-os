name: Ermete Nix Vanguard (Phase 3)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  nix-build:
    name: Zero-Trust Hermetic Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Validate Hermetic Environment (devShell)
        run: nix develop --command echo "✅ DevShell pura inizializzata con successo."

      - name: Compile Ermete OS Core Workspace (No Cache)
        run: nix build .#ermete-core
        
      - name: Verify Binary Determinism (Ermete OS Daemons)
        run: |
          echo "Binaries built successfully at:"
          ls -la result/bin/
          file result/bin/ermete-mesh-bus
