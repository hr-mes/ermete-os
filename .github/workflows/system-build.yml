---
name: 💿 System Image Build
on:
  workflow_run:
    workflows: ["🌋 Ermete Forge Orchestrator"]
    types: [completed]
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - 'system/**'
      - '.github/workflows/system-build.yml'
  workflow_dispatch:

env:
  IMAGE_DESC: "Ermete OS - Immutable Cloud-Native System"
  IMAGE_KEYWORDS: "bootc,fedora,Ermete,immutable"
  IMAGE_LOGO_URL: ""
  IMAGE_NAME: "ermete-os-system"
  IMAGE_REGISTRY: "ghcr.io/hr-mes"
  DEFAULT_TAG: "latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_container:
    name: 🏗️ Build System Image
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build_push.outputs.digest }}
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: ⚙️ Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧹 Maximize build space
        uses: ublue-os/remove-unwanted-software@v9

      - name: 📅 Get current date
        id: date
        run: echo "date=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" >> $GITHUB_OUTPUT

      - name: 🏷️ Generate Metadata
        uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.DEFAULT_TAG }}
            type=raw,value=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            type=raw,value={{date 'YYYYMMDD'}}
            type=sha,enable=${{ github.event_name == 'pull_request' }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            containers.bootc=1

      - name: 🔑 Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: 💾 Cache Podman storage
        uses: actions/cache@v4
        with:
          path: ~/.local/share/containers
          key: podman-system-build-${{ runner.os }}-${{ hashFiles('system/Containerfile') }}
          restore-keys: |
            podman-system-build-${{ runner.os }}-

      - name: 🧼 Install Bubblewrap
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: 🐳 Build and Push Image with Podman (Hermetic Sandbox)
        id: build_push
        run: |
          PRIMARY_TAG="${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}"
          
          echo "=> Pre-fetching base images for hermetic build..."
          podman pull ghcr.io/hr-mes/ermete-base-nvidia:latest || true
          podman pull ghcr.io/hr-mes/ermete-os-forge-tier0-repo:latest || true
          podman pull ghcr.io/hr-mes/ermete-os-forge-tier1-repo:latest || true
          podman pull ghcr.io/hr-mes/ermete-os-forge-tier2-repo:latest || true
          podman pull ghcr.io/hr-mes/ermete-os-forge-tier3-repo:latest || true

          TAG_ARGS=""
          for tag in ${{ steps.metadata.outputs.tags }}; do
            TAG_ARGS="$TAG_ARGS -t $tag"
          done

          LABEL_ARGS=""
          while IFS= read -r label; do
            [ -n "$label" ] && LABEL_ARGS="$LABEL_ARGS --label $label"
          done <<< "${{ steps.metadata.outputs.labels }}"

          echo "=> Building system image inside bubblewrap (network isolated)..."
          bwrap --unshare-net --dev-bind / / podman build \
            --network=none \
            --layers \
            $TAG_ARGS \
            $LABEL_ARGS \
            -f ./system/Containerfile ./system

          SHOULD_PUSH="${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}"
          if [ "$SHOULD_PUSH" = "true" ]; then
            echo "=> Pushing image tags to GHCR..."
            for tag in ${{ steps.metadata.outputs.tags }}; do
              podman push "$tag"
            done
            DIGEST=$(podman inspect --format '{{.Digest}}' "$PRIMARY_TAG" 2>/dev/null || true)
            if [ -z "$DIGEST" ] || [ "$DIGEST" = "<nil>" ]; then
              DIGEST=$(skopeo inspect "docker://$PRIMARY_TAG" | jq -r '.Digest' 2>/dev/null || true)
            fi
            echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
          fi

      - name: 🧹 Cleanup Workspace Permissions
        if: always()
        run: podman unshare chown -R $USER:$USER ${{ github.workspace }} || true

  security_scan:
    name: 🛡️ Security Audit
    needs: build_container
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔎 Run Trivy Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build_container.outputs.digest }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          timeout: '2m0s'

  sbom_sign:
    name: ✍️ SLSA Attestation & Signing
    needs: [build_container, security_scan]
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      id-token: write
    steps:
      - name: 🔑 Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: 🔐 Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.6.1'

      - name: 📦 Setup Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: 📜 Generate SBOM
        env:
          IMAGE_DIGEST: ${{ needs.build_container.outputs.digest }}
        run: |
          syft packages "ghcr.io/hr-mes/ermete-os-system@${IMAGE_DIGEST}" -o spdx-json=system-sbom.spdx.json

      - name: 📜 Generate SLSA 4 In-Toto Provenance Predicate
        env:
          IMAGE_DIGEST: ${{ needs.build_container.outputs.digest }}
        run: |
          cat <<EOF > slsa-provenance.json
          {
            "_type": "https://in-toto.io/Statement/v0.1",
            "predicateType": "https://slsa.dev/provenance/v1",
            "subject": [
              {
                "name": "ghcr.io/hr-mes/ermete-os-system",
                "digest": {
                  "sha256": "${IMAGE_DIGEST#sha256:}"
                }
              }
            ],
            "builder": {
              "id": "https://github.com/${{ github.repository }}/.github/workflows/system-build.yml@${{ github.ref }}"
            },
            "buildType": "https://actions.github.io/buildtypes/v1",
            "invocation": {
              "configSource": {
                "uri": "git+https://github.com/${{ github.repository }}@${{ github.sha }}",
                "digest": {
                  "sha256": "${{ github.sha }}"
                },
                "entryPoint": ".github/workflows/system-build.yml"
              }
            },
            "metadata": {
              "buildInvocationId": "${{ github.run_id }}-${{ github.run_attempt }}",
              "completeness": {
                "parameters": true,
                "environment": true,
                "materials": true
              },
              "reproducible": true
            }
          }
          EOF

      - name: ✍️ Sign & Attest OCI Image (SLSA 4 In-Toto)
        env:
          COSIGN_EXPERIMENTAL: 1
          IMAGE_DIGEST: ${{ needs.build_container.outputs.digest }}
        run: |
          IMAGE_REF="ghcr.io/hr-mes/ermete-os-system@${IMAGE_DIGEST}"
          cosign sign -y "${IMAGE_REF}"
          cosign attest -y --type spdxjson --predicate system-sbom.spdx.json "${IMAGE_REF}"
          cosign attest -y --type slsaprovenance --predicate slsa-provenance.json "${IMAGE_REF}"

      - name: ✅ Verify SLSA Level 4 Attestations
        env:
          IMAGE_DIGEST: ${{ needs.build_container.outputs.digest }}
        run: |
          IMAGE_REF="ghcr.io/hr-mes/ermete-os-system@${IMAGE_DIGEST}"
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository_owner }}/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE_REF}"
          cosign verify-attestation \
            --type spdxjson \
            --certificate-identity-regexp "^https://github.com/${{ github.repository_owner }}/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE_REF}"
          cosign verify-attestation \
            --type slsaprovenance \
            --certificate-identity-regexp "^https://github.com/${{ github.repository_owner }}/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE_REF}"
