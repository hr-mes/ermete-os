---
name: 💿 System Image Build
on:
  workflow_run:
    workflows: ["🌋 Ermete Forge Orchestrator"]
    types: [completed]
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - 'system/**'
      - '.github/workflows/system-build.yml'
  workflow_dispatch:

env:
  IMAGE_DESC: "Ermete OS - Immutable Cloud-Native System"
  IMAGE_KEYWORDS: "bootc,fedora,Ermete,immutable"
  IMAGE_LOGO_URL: ""
  IMAGE_NAME: "ermete-os-system"
  IMAGE_REGISTRY: "ghcr.io/hr-mes"
  DEFAULT_TAG: "latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_container:
    name: 🏗️ Build System Image
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build_push.outputs.digest }}
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: ⚙️ Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧹 Maximize build space
        uses: ublue-os/remove-unwanted-software@v9

      - name: 📅 Get current date
        id: date
        run: echo "date=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" >> $GITHUB_OUTPUT

      - name: 🏷️ Generate Metadata
        uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.DEFAULT_TAG }}
            type=raw,value=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            type=raw,value={{date 'YYYYMMDD'}}
            type=sha,enable=${{ github.event_name == 'pull_request' }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            containers.bootc=1

      - name: 🔑 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build and Push Image
        id: build_push
        uses: docker/build-push-action@v6
        with:
          context: ./system
          file: ./system/Containerfile
          push: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          pull: true
          outputs: type=image,push=${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }},compression=zstd,force-compression=true,oci-mediatypes=true

  security_scan:
    name: 🛡️ Security Audit
    needs: build_container
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔎 Run Trivy Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build_container.outputs.digest }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          timeout: '2m0s'

  sbom_sign:
    name: ✍️ SLSA Attestation & Signing
    needs: [build_container, security_scan]
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      id-token: write
    steps:
      - name: 🔑 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔐 Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.6.1'

      - name: 📦 Setup Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: 📜 Generate SBOM
        env:
          IMAGE_DIGEST: ${{ needs.build_container.outputs.digest }}
        run: |
          syft packages "ghcr.io/hr-mes/ermete-os-system@${IMAGE_DIGEST}" -o spdx-json=system-sbom.spdx.json

      - name: ✍️ Sign & Attest OCI Image
        env:
          COSIGN_EXPERIMENTAL: 1
          IMAGE_DIGEST: ${{ needs.build_container.outputs.digest }}
        run: |
          IMAGE_REF="ghcr.io/hr-mes/ermete-os-system@${IMAGE_DIGEST}"
          cosign sign -y "${IMAGE_REF}"
          cosign attest -y --type spdxjson --predicate system-sbom.spdx.json "${IMAGE_REF}"

      - name: ✅ Verify SLSA Level 4
        env:
          IMAGE_DIGEST: ${{ needs.build_container.outputs.digest }}
        run: |
          IMAGE_REF="ghcr.io/hr-mes/ermete-os-system@${IMAGE_DIGEST}"
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository_owner }}/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE_REF}"
          cosign verify-attestation \
            --type spdxjson \
            --certificate-identity-regexp "^https://github.com/${{ github.repository_owner }}/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE_REF}"
