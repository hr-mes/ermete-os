name: Ermete OS Kernel Live Patching

on:
  push:
    branches: [ "main" ]
    paths:
      - 'kernel/patches/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-livepatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/hr-mes/ermete-os-builder:${{ vars.BUILDER_STABLE_TAG || 'latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ⚙️ Set Default Rust Toolchain
        run: rustup default stable


      - name: Build Live Patch
        run: |
          set -euo pipefail
          echo "Building kpatch..."
          mkdir -p forge/build/livepatch
          for patch in kernel/patches/*.patch; do
            if [ -f "$patch" ]; then
              kpatch-build -t vmlinux -v "$patch" -o forge/build/livepatch/
            fi
          done

      - name: Package Live Patch
        run: |
          set -euo pipefail
          echo "Packaging live patch into RPM..."
          if [ -f "forge/specs/ermete-livepatch/ermete-livepatch.spec" ]; then
            rpmbuild -ba forge/specs/ermete-livepatch/ermete-livepatch.spec
          fi
          


      - name: Upload Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ermete-livepatch
          path: forge/build/livepatch/
          compression-level: 1

