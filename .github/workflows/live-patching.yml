name: Ermete OS Kernel Live Patching

on:
  push:
    branches: [ "main" ]
    paths:
      - 'kernel/patches/**'
  workflow_dispatch:

jobs:
  build-livepatch:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/hr-mes/ermete-os-builder:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: ⚙️ Set Default Rust Toolchain
        run: rustup default stable


      - name: Build Live Patch
        run: |
          echo "Building kpatch..."
          mkdir -p build/livepatch
          for patch in kernel/patches/*.patch; do
            if [ -f "$patch" ]; then
              kpatch-build -t vmlinux -v "$patch" -o build/livepatch/
            fi
          done

      - name: Package Live Patch
        run: |
          echo "Packaging live patch into RPM..."
          if [ -f "forge/specs/ermete-livepatch/ermete-livepatch.spec" ]; then
            rpmbuild -ba forge/specs/ermete-livepatch/ermete-livepatch.spec
          fi
          


      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ermete-livepatch
          path: build/livepatch/
          compression-level: 1

