name: Rust Security & FFI Audit

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  security-audit:
    name: Enforce Safety & Cargo Vet Audit
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/hr-mes/ermete-os-builder:latest
    steps:
      - name: Install System Dependencies
        run: dnf install -y cairo-devel pango-devel gdk-pixbuf2-devel gtk4-devel glib2-devel gtk4-layer-shell-devel

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Extreme Rust Cache (LLVM & Dependencies)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-security-audit"
          cache-on-failure: "true"

      - name: Install cargo-vet and cargo-deny fast
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-vet,cargo-deny

      - name: Check Unsafe Code & Clippy Policies
        run: |
          cargo clippy --all-targets --all-features -- \
            -D clippy::undocumented_unsafe_blocks \
            -D clippy::multiple_unsafe_ops_per_block \
            -D warnings

      - name: Verify Cryptographic Supply-Chain Audits (cargo-vet)
        run: |
          cargo vet check

      - name: Check Dependencies & Vulnerabilities (cargo-deny)
        run: |
          cargo deny check

  kani-verification:
    name: 🔬 Kani Formal Verification (${{ matrix.module }} - Shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - module: allocator-core
            shard: 1
            dir: forge/specs/ermete-gatekeeper-rs/ermete-gatekeeper-rs-1.0.0
            harness: allocator
          - module: allocator-bounds
            shard: 2
            dir: forge/specs/ermete-gatekeeper-rs/ermete-gatekeeper-rs-1.0.0
            harness: allocator_bounds
          - module: ipc-core
            shard: 3
            dir: forge/specs/ermete-gatekeeper-rs/ermete-gatekeeper-rs-1.0.0
            harness: ipc
          - module: ipc-channel
            shard: 4
            dir: forge/specs/ermete-gatekeeper-rs/ermete-gatekeeper-rs-1.0.0
            harness: ipc_channel
          - module: security-ct-eq
            shard: 5
            dir: forge/specs/ermete-gatekeeper-rs/ermete-gatekeeper-rs-1.0.0
            harness: proof_constant_time_eq_no_panic
          - module: security-auth-token
            shard: 6
            dir: forge/specs/ermete-gatekeeper-rs/ermete-gatekeeper-rs-1.0.0
            harness: proof_verify_auth_token_no_panic
          - module: security-fanotify-bounds
            shard: 7
            dir: forge/specs/ermete-gatekeeper-rs/ermete-gatekeeper-rs-1.0.0
            harness: proof_parse_next_fanotify_offset_bounds_safety
          - module: security-rate-limit
            shard: 8
            dir: forge/specs/ermete-gatekeeper-rs/ermete-gatekeeper-rs-1.0.0
            harness: proof_evaluate_execution_rate_limit_no_overflow
          - module: attestation-core
            shard: 9
            dir: system/confidential_computing/ermete-attestation
            harness: attestation
          - module: attestation-cvm
            shard: 10
            dir: system/confidential_computing/ermete-attestation
            harness: cvm_manager
          - module: attestation-key-release
            shard: 11
            dir: system/confidential_computing/ermete-attestation
            harness: key_release
          - module: attestation-sev-snp
            shard: 12
            dir: system/confidential_computing/ermete-attestation
            harness: sev_snp
          - module: attestation-tdx
            shard: 13
            dir: system/confidential_computing/ermete-attestation
            harness: tdx
          - module: attestation-verifier
            shard: 14
            dir: system/confidential_computing/ermete-attestation
            harness: verifier
          - module: cloud-zk-mesh
            shard: 15
            dir: forge/specs/ermete-cloud-rs/ermete-cloud-rs-1.0.0
            harness: zk
          - module: cloud-bft-consensus
            shard: 16
            dir: forge/specs/ermete-cloud-rs/ermete-cloud-rs-1.0.0
            harness: bft
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Extreme Rust Cache (Kani Proof Artifacts)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "kani-${{ matrix.module }}-${{ matrix.shard }}"
          cache-on-failure: "true"

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libgtk-4-dev

      - name: Install AWS Kani Verifier
        run: |
          cargo install --locked kani-verifier || true
          cargo kani setup

      - name: Run Mathematical Proofs (${{ matrix.module }})
        run: |
          cd ${{ matrix.dir }}
          if [ -n "${{ matrix.harness }}" ]; then
            cargo kani --harness "*${{ matrix.harness }}*" 2>/dev/null || cargo kani
          else
            cargo kani
          fi

      - name: 📦 Upload Formal Verification Artifacts (ZSTD Compressed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kani-proof-shard-${{ matrix.shard }}-${{ matrix.module }}
          path: ${{ matrix.dir }}/target/
          if-no-files-found: ignore
          compression-level: 1

  bare-metal-audit:
    name: ⚡ eBPF & Bare-Metal Build Audit (${{ matrix.target_name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - target_name: ebpf-xdp-firewall
            component: ebpf
            dir: system/ebpf/ebpf-core
            cmd: cargo build --target bpfel-unknown-none -Z build-std=core --release
          - target_name: gatekeeper-baremetal
            component: gatekeeper
            dir: forge/specs/ermete-gatekeeper-rs/ermete-gatekeeper-rs-1.0.0
            cmd: cargo build --release
          - target_name: attestation-baremetal
            component: attestation
            dir: system/confidential_computing/ermete-attestation
            cmd: cargo build --release
          - target_name: cloud-zk-baremetal
            component: cloud
            dir: forge/specs/ermete-cloud-rs/ermete-cloud-rs-1.0.0
            cmd: cargo build --release
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust (Nightly for no_std & eBPF)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Extreme Rust Cache (Bare Metal & eBPF)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "bare-metal-${{ matrix.target_name }}"
          cache-on-failure: "true"

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libgtk-4-dev

      - name: Install bpf-linker
        if: matrix.component == 'ebpf'
        run: cargo install bpf-linker || true

      - name: Compile Component (${{ matrix.target_name }})
        run: |
          cd ${{ matrix.dir }}
          ${{ matrix.cmd }}

      - name: 📦 Upload Bare-Metal Audit Artifacts (ZSTD Compressed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baremetal-artifact-${{ matrix.target_name }}
          path: ${{ matrix.dir }}/target/
          if-no-files-found: ignore
          compression-level: 1


