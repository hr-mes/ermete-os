name: Rust Security & FFI Audit

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  security-audit:
    name: Enforce Safety & Cargo Vet Audit
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/hr-mes/ermete-os-builder:latest
    steps:
      - name: Install System Dependencies
        run: dnf install -y cairo-devel pango-devel gdk-pixbuf2-devel gtk4-devel glib2-devel gtk4-layer-shell-devel

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install cargo-vet and cargo-deny fast
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-vet,cargo-deny

      - name: Check Unsafe Code & Clippy Policies
        run: |
          cargo clippy --all-targets --all-features -- \
            -D clippy::undocumented_unsafe_blocks \
            -D clippy::multiple_unsafe_ops_per_block \
            -D warnings

      - name: Verify Cryptographic Supply-Chain Audits (cargo-vet)
        run: |
          cargo vet check

      - name: Check Dependencies & Vulnerabilities (cargo-deny)
        run: |
          cargo deny check

  kani-verification:
    name: 🔬 Kani Formal Verification
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libgtk-4-dev

      - name: Install AWS Kani Verifier
        run: |
          cargo install --locked kani-verifier
          cargo kani setup

      - name: Run Mathematical Proofs (Gatekeeper)
        run: |
          cd forge/specs/ermete-gatekeeper-rs/ermete-gatekeeper-rs-1.0.0
          cargo kani

  bare-metal-audit:
    name: ⚡ eBPF & Bare-Metal Build Audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust (Nightly for no_std & eBPF)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libgtk-4-dev

      - name: Install bpf-linker
        run: cargo install bpf-linker

      - name: Compile XDP Zero-Trust Firewall (eBPF)
        run: |
          cd system/ebpf/ebpf-core
          cargo build --target bpfel-unknown-none -Z build-std=core --release

      - name: Compile Gatekeeper (no_std Bare-Metal)
        run: |
          cd forge/specs/ermete-gatekeeper-rs/ermete-gatekeeper-rs-1.0.0
          cargo build --release

