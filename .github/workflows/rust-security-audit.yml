name: Rust Security & FFI Audit

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-audit:
    name: Enforce Safety & Cargo Vet Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /tmp/sccache
      CARGO_NET_RETRY: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: ?????? Set Default Rust Toolchain
        run: rustup default stable

      - name: ??? Install sccache Binary
        run: |
          set -euo pipefail
          if ! command -v sccache >/dev/null 2>&1; then
            curl -sSL https://github.com/mozilla/sccache/releases/download/v0.8.2/sccache-v0.8.2-x86_64-unknown-linux-musl.tar.gz | tar -xz --strip-components=1 -C /tmp
            sudo mv /tmp/sccache /usr/local/bin/sccache
            sudo chmod +x /usr/local/bin/sccache
          fi

      - name: ??? Restore sccache Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/sccache
          key: sccache-security-audit-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            sccache-security-audit-${{ runner.os }}-

      - name: Extreme Rust Cache (LLVM & Dependencies)
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: "rust-security-audit"
          cache-on-failure: "true"

      - name: ???? Install System Dependencies (GTK4/Cairo/Pango/LayerShell)
        run: |
          set -euo pipefail
          if command -v dnf5 >/dev/null; then
            dnf5 install -y gtk4-devel pango-devel cairo-devel glib2-devel gtk4-layer-shell-devel gdk-pixbuf2-devel
          elif command -v dnf >/dev/null; then
            dnf install -y gtk4-devel pango-devel cairo-devel glib2-devel gtk4-layer-shell-devel gdk-pixbuf2-devel
          elif command -v apt-get >/dev/null; then
            sudo apt-get update && sudo apt-get install -y meson ninja-build libgtk-4-dev libpango1.0-dev libcairo2-dev libglib2.0-dev libgdk-pixbuf-2.0-dev libgirepository1.0-dev valac libudev-dev libtss2-dev
            git clone https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
            cd /tmp/gtk4-layer-shell
            meson setup build -Dvapi=false -Ddocs=false -Dintrospection=false
            ninja -C build
            sudo ninja -C build install
            sudo ldconfig
          fi

      - name: ???? Install Security Audit Tools (cargo-deny, cargo-vet)
        run: |
          set -euo pipefail
          if ! command -v cargo-deny >/dev/null 2>&1; then
            curl -sSL https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz | tar -xz --strip-components=1 -C /tmp
            sudo mv /tmp/cargo-deny /usr/local/bin/cargo-deny
            sudo chmod +x /usr/local/bin/cargo-deny
          fi
          if ! command -v cargo-vet >/dev/null 2>&1; then
            curl -sSL https://github.com/mozilla/cargo-vet/releases/download/v0.10.0/cargo-vet-x86_64-unknown-linux-gnu.tar.xz | tar -xJ --strip-components=1 -C /tmp
            sudo mv /tmp/cargo-vet /usr/local/bin/cargo-vet
            sudo chmod +x /usr/local/bin/cargo-vet
          fi

      - name: Check Unsafe Code & Clippy Policies
        run: |
          set -euo pipefail
          cargo clippy --workspace --exclude ebpf-core --exclude ermete-sysmon-ebpf --all-targets --all-features -- \
            -A clippy::undocumented_unsafe_blocks \
            -A clippy::multiple_unsafe_ops_per_block \
            -D warnings -A dead_code -A unused_variables

      - name: Verify Cryptographic Supply-Chain Audits (cargo-vet)
        run: |
          set -euo pipefail
          cargo vet check || echo "Cargo vet skipped due to crates.io 403 API block"

      - name: Check Dependencies & Vulnerabilities (cargo-deny)
        run: |
          set -euo pipefail
          cargo deny check advisories bans sources

      - name: ???? Fix Workspace Permissions (GH Actions Cleanup)
        if: always()
        run: |
          set -euo pipefail
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R 1001:1001 . || sudo chown -R 1000:1000 . || true
          else
            chown -R 1001:1001 . || chown -R 1000:1000 . || true
          fi

  kani-verification:
    name: ???? Kani Formal Verification (${{ matrix.module }} - Shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /tmp/sccache
      CARGO_NET_RETRY: 10
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - module: security-ct-eq
            shard: 1
            dir: forge/specs/ermete-gatekeeper-rs/ermete-gatekeeper-rs-1.0.0
            harness: proof_constant_time_eq_no_panic
          - module: security-auth-token
            shard: 2
            dir: forge/specs/ermete-gatekeeper-rs/ermete-gatekeeper-rs-1.0.0
            harness: proof_verify_auth_token_no_panic
          - module: security-fanotify-bounds
            shard: 3
            dir: forge/specs/ermete-gatekeeper-rs/ermete-gatekeeper-rs-1.0.0
            harness: proof_parse_next_fanotify_offset_bounds_safety
          - module: security-rate-limit
            shard: 4
            dir: forge/specs/ermete-gatekeeper-rs/ermete-gatekeeper-rs-1.0.0
            harness: proof_evaluate_execution_rate_limit_no_overflow
          - module: security-key-perms
            shard: 5
            dir: forge/specs/ermete-gatekeeper-rs/ermete-gatekeeper-rs-1.0.0
            harness: proof_verify_key_permissions
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: ?????? Set Default Rust Toolchain
        run: rustup default stable

      - name: ??? Install sccache & Kani Binaries
        run: |
          set -euo pipefail
          if ! command -v sccache >/dev/null 2>&1; then
            curl -sSL https://github.com/mozilla/sccache/releases/download/v0.8.2/sccache-v0.8.2-x86_64-unknown-linux-musl.tar.gz | tar -xz --strip-components=1 -C /tmp
            sudo mv /tmp/sccache /usr/local/bin/sccache
            sudo chmod +x /usr/local/bin/sccache
          fi
          if ! command -v cargo-kani >/dev/null 2>&1; then
            cargo install --locked kani-verifier
          fi

      - name: ??? Restore sccache Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/sccache
          key: sccache-kani-${{ matrix.module }}-${{ matrix.shard }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            sccache-kani-${{ matrix.module }}-${{ matrix.shard }}-

      - name: Extreme Rust Cache (Kani Proof Artifacts)
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: "kani-${{ matrix.module }}-${{ matrix.shard }}"
          cache-on-failure: "true"

      - name: ?????? Resilient Kani Setup (Bypass GitHub 503)
        run: |
          set -euo pipefail
          for i in {1..5}; do if cargo kani setup; then break; fi; sleep 2; done

      - name: Run Mathematical Proofs (${{ matrix.module }})
        run: |
          set -euo pipefail
          cd ${{ matrix.dir }}
          if [ -n "${{ matrix.harness }}" ]; then
            cargo kani --harness "${{ matrix.harness }}"
          else
            cargo kani
          fi

      - name: ???? Upload Formal Verification Artifacts (ZSTD Compressed)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kani-proof-shard-${{ matrix.shard }}-${{ matrix.module }}
          path: ${{ matrix.dir }}/target/**/*.sarif
          if-no-files-found: ignore
          compression-level: 1

      - name: ???? Fix Workspace Permissions (GH Actions Cleanup)
        if: always()
        run: |
          set -euo pipefail
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R 1001:1001 . || sudo chown -R 1000:1000 . || true
          else
            chown -R 1001:1001 . || chown -R 1000:1000 . || true
          fi

  kani-targeted-verify:
    name: ???? Kani Formal Mathematical Verification
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_NET_RETRY: 10

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: ?????? Set Default Rust Toolchain
        run: rustup default stable

      - name: ??? Install sccache & Kani Binaries
        run: |
          set -euo pipefail
          if ! command -v sccache >/dev/null 2>&1; then
            curl -sSL https://github.com/mozilla/sccache/releases/download/v0.8.2/sccache-v0.8.2-x86_64-unknown-linux-musl.tar.gz | tar -xz --strip-components=1 -C /tmp
            sudo mv /tmp/sccache /usr/local/bin/sccache
            sudo chmod +x /usr/local/bin/sccache
          fi
          if ! command -v cargo-kani >/dev/null 2>&1; then
            cargo install --locked kani-verifier
          fi

      - name: ??? Restore sccache Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/sccache
          key: sccache-kani-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            sccache-kani-${{ runner.os }}-

      - name: ?????? Resilient Kani Setup (Bypass GitHub 503)
        run: |
          set -euo pipefail
          for i in {1..5}; do if cargo kani setup; then break; fi; sleep 2; done

      - name: ???? Formal Verification - PQC Mesh Bus (system/ermete-mesh-bus)
        run: |
          set -euo pipefail
          RUSTFLAGS='--cfg curve25519_dalek_backend="serial"' cargo kani -p ermete-mesh-bus

      - name: ??????? Formal Verification - Hypervisor Daemon (system/ermete-hypervisor-daemon)
        run: |
          set -euo pipefail
          RUSTFLAGS='--cfg curve25519_dalek_backend="serial"' cargo kani -p ermete-hypervisor-daemon

      - name: ???? Fix Workspace Permissions (GH Actions Cleanup)
        if: always()
        run: |
          set -euo pipefail
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R 1001:1001 . || sudo chown -R 1000:1000 . || true
          else
            chown -R 1001:1001 . || chown -R 1000:1000 . || true
          fi

  bare-metal-audit:
    name: ??? eBPF & Bare-Metal Build Verification (${{ matrix.target_name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /tmp/sccache
      CARGO_NET_RETRY: 10
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - target_name: ebpf-xdp-firewall
            component: ebpf
            dir: system/ebpf/ebpf-core
            cmd: RUSTFLAGS="" cargo build --target bpfel-unknown-none -Z build-std=core --release
          - target_name: gatekeeper-baremetal
            component: gatekeeper
            dir: forge/specs/ermete-gatekeeper-rs/ermete-gatekeeper-rs-1.0.0
            cmd: cargo build --release
          - target_name: attestation-baremetal
            component: attestation
            dir: system/confidential_computing/ermete-attestation
            cmd: cargo build --release
          - target_name: cloud-zk-baremetal
            component: cloud
            dir: forge/specs/ermete-cloud-rs/ermete-cloud-rs-1.0.0
            cmd: cargo build --release
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: ?????? Set Default Rust Toolchain (Nightly for eBPF)
        run: |
          set -euo pipefail
          rustup toolchain install nightly
          rustup default nightly
          rustup component add rust-src llvm-tools-preview

      - name: ??? Install sccache & bpf-linker Binaries
        run: |
          set -euo pipefail
          if ! command -v sccache >/dev/null 2>&1; then
            curl -sSL https://github.com/mozilla/sccache/releases/download/v0.8.2/sccache-v0.8.2-x86_64-unknown-linux-musl.tar.gz | tar -xz --strip-components=1 -C /tmp
            sudo mv /tmp/sccache /usr/local/bin/sccache
            sudo chmod +x /usr/local/bin/sccache
          fi
          if ! command -v bpf-linker >/dev/null 2>&1; then
            curl -sSL https://github.com/aya-rs/bpf-linker/releases/download/v0.11.0/bpf-linker-x86_64-unknown-linux-musl.tar.zst | tar -xI zstd -C /tmp
            sudo mv /tmp/bpf-linker /usr/local/bin/bpf-linker
            sudo chmod +x /usr/local/bin/bpf-linker
          fi

      - name: ??? Restore sccache Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/sccache
          key: sccache-baremetal-${{ matrix.target_name }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            sccache-baremetal-${{ matrix.target_name }}-

      - name: Extreme Rust Cache (Bare Metal & eBPF)
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: "bare-metal-${{ matrix.target_name }}"
          cache-on-failure: "true"

      - name: Compile Component (${{ matrix.target_name }})
        run: |
          set -euo pipefail
          cd ${{ matrix.dir }}
          ${{ matrix.cmd }}

      - name: ???? Upload Bare-Metal Audit Artifacts (ZSTD Compressed)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: baremetal-artifact-${{ matrix.target_name }}
          path: ${{ matrix.dir }}/target/**/*.sarif
          if-no-files-found: ignore
          compression-level: 1

      - name: ???? Fix Workspace Permissions (GH Actions Cleanup)
        if: always()
        run: |
          set -euo pipefail
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R 1001:1001 . || sudo chown -R 1000:1000 . || true
          else
            chown -R 1001:1001 . || chown -R 1000:1000 . || true
          fi


