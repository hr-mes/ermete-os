name: Rust Security & FFI Audit

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  security-audit:
    name: Enforce Safety & Cargo Vet Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libglib2.0-dev

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install cargo-vet and cargo-deny
        run: |
          cargo install cargo-vet cargo-deny --locked || true

      - name: Check Unsafe Code & Clippy Policies
        run: |
          cargo clippy --all-targets --all-features -- \
            -D unsafe_code \
            -D clippy::undocumented_unsafe_blocks \
            -D clippy::multiple_unsafe_ops_per_block \
            -D warnings

      - name: Verify Cryptographic Supply-Chain Audits (cargo-vet)
        run: |
          cargo vet check

      - name: Check Dependencies & Vulnerabilities (cargo-deny)
        run: |
          cargo deny check
