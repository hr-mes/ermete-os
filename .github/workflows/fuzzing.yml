name: 🛡️ Rust Security & Buffer Overflow Fuzzing

on:
  push:
    branches: [ main ]
    paths:
      - 'forge/specs/*-rs/**'
      - 'forge/specs/ermete-backup/**'
      - 'tests/fuzz/**'
      - '.github/workflows/fuzzing.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'forge/specs/*-rs/**'
      - 'forge/specs/ermete-backup/**'
      - 'tests/fuzz/**'
      - '.github/workflows/fuzzing.yml'
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: 'Tempo di fuzzing per ciascun target (in secondi)'
        required: false
        default: '60'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: 🎯 Fuzz Unified Suite (${{ matrix.sanitizer_name }})
    runs-on: ubuntu-24.04
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /tmp/sccache
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        sanitizer: [address, memory]
        include:
          - sanitizer: address
            sanitizer_name: AddressSanitizer
          - sanitizer: memory
            sanitizer_name: MemorySanitizer

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: ❄️ Install Nix (Bedrock Cache)
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - name: ⚙️ Set Default Rust Toolchain & Install cargo-fuzz
        run: |
          rustup default nightly
          rustup component add rust-src
          nix profile install nixpkgs#cargo-fuzz nixpkgs#sccache


      - name: ⚡ Restore sccache Cache
        uses: actions/cache@v4
        with:
          path: /tmp/sccache
          key: sccache-fuzz-${{ matrix.sanitizer }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            sccache-fuzz-${{ matrix.sanitizer }}-

      - name: ⚡ Extreme Rust Cache (LLVM & Dependencies)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "cargo-fuzz-${{ matrix.sanitizer }}"
          cache-on-failure: "true"
          workspaces: "tests/fuzz -> target"
      - name: 🔍 Run Cargo Fuzz (${{ matrix.sanitizer_name }})
        run: |
          FUZZ_TIME="${{ github.event.inputs.fuzz_seconds }}"
          if [ -z "$FUZZ_TIME" ]; then
            FUZZ_TIME="60"
          fi
          
          cd tests/fuzz

          TARGETS=$(cargo fuzz list --fuzz-dir . 2>/dev/null || ls fuzz_targets/*.rs 2>/dev/null | xargs -n 1 basename | sed 's/\.rs$//')

          if [ -z "$TARGETS" ]; then
            echo "❌ ERROR: Nessun target di fuzzing valido in tests/fuzz"
            exit 1
          fi

          echo "🎯 Target di Fuzzing individuati: $TARGETS"
          
          FAILED=0
          for target in $TARGETS; do
            echo "🔥 Running cargo fuzz su target '$target' per ${FUZZ_TIME}s con ${{ matrix.sanitizer_name }}..."
            cargo fuzz run --fuzz-dir . -s ${{ matrix.sanitizer }} "$target" -- -max_total_time="$FUZZ_TIME" || FAILED=$((FAILED+1))
          done
          exit $FAILED

      - name: 🚨 Upload Fuzzing Crash Artifacts (ZSTD Compressed)
        if: failure() || always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.sanitizer }}
          path: |
            tests/fuzz/artifacts/
            tests/fuzz/corpus/
          if-no-files-found: ignore
          compression-level: 1

