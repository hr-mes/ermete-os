name: 🛡️ Rust Security & Buffer Overflow Fuzzing

on:
  push:
    branches: [ main ]
    paths:
      - 'forge/specs/*-rs/**'
      - 'forge/specs/ermete-backup/**'
      - 'tests/fuzz/**'
      - '.github/workflows/fuzzing.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'forge/specs/*-rs/**'
      - 'forge/specs/ermete-backup/**'
      - 'tests/fuzz/**'
      - '.github/workflows/fuzzing.yml'
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: 'Tempo di fuzzing per ciascun target (in secondi)'
        required: false
        default: '60'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: 🎯 Fuzz Unified Suite (${{ matrix.sanitizer_name }})
    runs-on: ubuntu-24.04
    container: ghcr.io/hr-mes/ermete-os-builder:latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        sanitizer: [address, thread, memory, leak]
        include:
          - sanitizer: address
            sanitizer_name: AddressSanitizer
          - sanitizer: thread
            sanitizer_name: ThreadSanitizer
          - sanitizer: memory
            sanitizer_name: MemorySanitizer
          - sanitizer: leak
            sanitizer_name: LeakSanitizer

    steps:
      - name: Install System Dependencies
        run: dnf install -y cairo-devel pango-devel gdk-pixbuf2-devel gtk4-devel glib2-devel gtk4-layer-shell-devel

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 🛠️ Install Rust Nightly & LLVM Tools
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview, rust-src

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v2

      - name: ⚡ Extreme Rust Cache (LLVM & Dependencies)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "cargo-fuzz-${{ matrix.sanitizer }}"
          cache-on-failure: "true"

      - name: 📦 Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: 🔍 Run Cargo Fuzz (${{ matrix.sanitizer_name }})
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_DIRECT: "true"
        run: |
          set -e
          
          FUZZ_TIME="${{ github.event.inputs.fuzz_seconds }}"
          if [ -z "$FUZZ_TIME" ]; then
            FUZZ_TIME="60"
          fi
          
          cd tests/fuzz

          TARGETS=$(cargo fuzz list --fuzz-dir . 2>/dev/null || ls fuzz_targets/*.rs 2>/dev/null | xargs -n 1 basename | sed 's/\.rs$//')

          if [ -z "$TARGETS" ]; then
            echo "❌ ERROR: Nessun target di fuzzing valido in tests/fuzz"
            exit 1
          fi

          echo "🎯 Target di Fuzzing individuati: $TARGETS"
          
          for target in $TARGETS; do
            echo "🔥 Running cargo fuzz su target '$target' per ${FUZZ_TIME}s con ${{ matrix.sanitizer_name }}..."
            cargo fuzz run --fuzz-dir . "$target" -- -max_total_time="$FUZZ_TIME" -sanitizer=${{ matrix.sanitizer }}
          done

      - name: 🚨 Upload Fuzzing Crash Artifacts (ZSTD Compressed)
        if: failure() || always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.sanitizer }}
          path: |
            tests/fuzz/artifacts/
            tests/fuzz/corpus/
          if-no-files-found: ignore
          compression-level: 1
