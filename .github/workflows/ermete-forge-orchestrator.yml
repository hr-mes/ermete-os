  build-kernel:
    needs: [build-builder]
    name: 🧬 Build Chimera Kernel RPM (${{ matrix.target }})
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        # target: [x86_64, aarch64, riscv64] # ARM/RISC-V disabled to save local disk space
        target: [x86_64]
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      
    - name: ⚡ Restore/Save Kernel CCache
      uses: actions/cache@v4
      with:
        path: .ccache_local
        key: kernel-ccache-${{ runner.os }}-${{ hashFiles('forge/specs/ermete-kernel/**') }}
        restore-keys: |
          kernel-ccache-${{ runner.os }}-

    - name: 🚀 Boot Isolator (Start Ermete Builder Container)
      run: |
        set -euo pipefail
        echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
        podman run -d --name chimera-builder-${{ matrix.target }} --pull=always \
          --cap-add SYS_ADMIN \
          --security-opt label=disable \
          --security-opt seccomp=unconfined \
          -v ${{ github.workspace }}:/forge \
          -w /forge \
          ghcr.io/hr-mes/ermete-os-builder:${{ needs.build-builder.outputs.content_hash }} sleep infinity
          

        
    - name: "🧬 Phase 1: Fetch, Validate & Chimera Merge"
      run: podman exec chimera-builder-${{ matrix.target }} bash forge/specs/ermete-kernel/prepare-chimera.sh
        
    - name: "📊 Collect AutoFDO & BOLT Profiles"
      env:
        HARDWARE_HASH: ${{ github.event.inputs.hardware_hash || '' }}
      run: |
        set -euo pipefail
        podman exec -e HARDWARE_HASH="${HARDWARE_HASH}" chimera-builder-${{ matrix.target }} bash -c "set -euo pipefail; \
          echo '=== Collecting AutoFDO Profiles ==='
          mkdir -p /forge/profiles
          if [ -n \"\${HARDWARE_HASH:-}\" ]; then
            echo 'Fetching hardware-specific profiles from decentralized cache...'
            curl -sSfL \"https://telemetry.ermete-os.org/profiles/\${HARDWARE_HASH:-}/kernel_bolt.fdata\" -o /forge/profiles/kernel_bolt.fdata || echo 'No hardware-specific profile found. Operating without PGO/BOLT.'
            
            # 🛡️ ZERO-TRUST ENFORCEMENT: Crittografia obbligatoria sul PGO/BOLT
            if [ -f /forge/profiles/kernel_bolt.fdata ]; then
              echo 'Verifying BOLT Profile Authenticity via Cosign...'
              curl -sSfL \"https://telemetry.ermete-os.org/profiles/\${HARDWARE_HASH:-}/kernel_bolt.fdata.sig\" -o /forge/profiles/kernel_bolt.fdata.sig || true
              if [ -f /forge/profiles/kernel_bolt.fdata.sig ]; then
                cosign verify-blob --key https://telemetry.ermete-os.org/telemetry.pub --signature /forge/profiles/kernel_bolt.fdata.sig /forge/profiles/kernel_bolt.fdata || { echo '❌ CRITICAL: Invalid BOLT profile signature! Supply Chain Attack averted.'; rm -f /forge/profiles/kernel_bolt.fdata; exit 1; }
                echo '✅ BOLT Profile cryptographically verified.'
              else
                echo '⚠️ WARNING: No signature found for BOLT profile. Dropping payload to maintain Zero-Trust Air-Gap.'
                rm -f /forge/profiles/kernel_bolt.fdata
              fi
            fi
          else
            echo 'Generic build requested. Skipping AutoFDO/BOLT profiling.'
          fi
        "

    - name: "⚙️ Phase 2: LLVM/ThinLTO & AutoFDO/BOLT Macro Injection"
      env:
        MARCH_TARGET: ${{ github.event.inputs.march_target || 'x86-64-v3' }}
      run: |
        set -euo pipefail
        podman exec -e MARCH_TARGET="${MARCH_TARGET}" chimera-builder-${{ matrix.target }} bash -c "set -euo pipefail; \
          export CCACHE_DIR=/forge/.ccache_local
          export CCACHE_COMPRESS=1
          export CCACHE_MAXSIZE=3G
          cat << MACRO >> ~/.rpmmacros
        %_smp_mflags -j\$(nproc)
        %toolchain clang
        %__make /usr/bin/make LLVM=1 LLVM_IAS=1
        %__cc clang
        %__cxx clang++
        %_build_cc clang
        %_build_cxx clang++
        %_host_cc clang
        %_host_cxx clang++
        %_ld ld.lld
        %_ldflags -Wl,-O2 -Wl,--as-needed -Wl,--sort-common -Wl,-z,now -Wl,-z,relro -fuse-ld=lld
        %optflags %{__global_compiler_flags} -march=\${MARCH_TARGET} -pipe -Wno-error -flto=thin
        %kcflags -march=\${MARCH_TARGET} -pipe -Wno-error -flto=thin
        MACRO
        "
        
    - name: "🔥 Phase 3: RPMBuild (Clang LTO + AutoFDO + BOLT)"
      run: |
        set -euo pipefail
        podman exec chimera-builder-${{ matrix.target }} bash -c "set -euo pipefail; \
          export CCACHE_DIR=/forge/.ccache_local
          export PATH=/usr/lib64/ccache:/usr/lib/ccache:\$PATH
          cd ~/rpmbuild/SPECS
          rpmbuild -bb --with toolchain_clang --with clang_lto --with clang_fdo --with bolt --noprep kernel.spec --target x86_64 </dev/null
          
          echo '=== Applying Post-Build BOLT Binary Optimization ==='
          if [ -f ~/rpmbuild/BUILD/vmlinux ]; then
            if [ -f /forge/profiles/kernel_bolt.fdata ]; then
              llvm-bolt ~/rpmbuild/BUILD/vmlinux -o ~/rpmbuild/BUILD/vmlinux.bolt -data=/forge/profiles/kernel_bolt.fdata -reorder-blocks=ext-tsp -reorder-functions=hfsort -split-functions || true
            else
              echo 'BOLT optimization skipped: no profiling data available'
            fi
          fi
          
          mkdir -p /forge/RPMS_OUT
          cp ~/rpmbuild/RPMS/x86_64/*.rpm /forge/RPMS_OUT/
        "
        

          
    - name: Upload Binary RPMs
      uses: actions/upload-artifact@v4
      with:
        name: ermete-chimera-kernel-rpms
        path: RPMS_OUT/*.rpm
        compression-level: 1
        
    - name: Publish Kernel Micro-Container OCI
      env:
        HARDWARE_HASH: ${{ github.event.inputs.hardware_hash || 'generic' }}
      run: |
        set -euo pipefail
        podman exec -e HARDWARE_HASH="${HARDWARE_HASH}" chimera-builder-${{ matrix.target }} bash -c "set -euo pipefail; \
          export STORAGE_DRIVER=vfs
          export BUILDAH_ISOLATION=chroot
          buildah login -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }} ghcr.io
          ctr=\$(buildah from scratch)
          buildah copy \$ctr /forge/RPMS_OUT/*.rpm /
          IMAGE_BASE='ghcr.io/hr-mes/ermete-os-kernel'
          IMAGE_LATEST=\$(echo \"\${IMAGE_BASE}:latest\" | tr '[:upper:]' '[:lower:]')
          HW_TAG=\"\${HARDWARE_HASH:-generic}\"
          IMAGE_HW=\$(echo \"\${IMAGE_BASE}:\${HW_TAG}\" | tr '[:upper:]' '[:lower:]')
          buildah commit --omit-timestamp \$ctr \$IMAGE_LATEST
          buildah tag \$IMAGE_LATEST \$IMAGE_HW
          buildah push --digestfile /forge/kernel_digest.txt \$IMAGE_LATEST docker://\$IMAGE_LATEST
          buildah push \$IMAGE_HW docker://\$IMAGE_HW
        "
        echo "KERNEL_DIGEST=$(cat kernel_digest.txt | tr -d '\n')" >> $GITHUB_ENV

    - name: Generate Kernel SBOM (Syft)
      run: |
        set -euo pipefail
        podman exec chimera-builder-${{ matrix.target }} bash -c "set -euo pipefail; \
          syft ghcr.io/hr-mes/ermete-os-kernel@${{ env.KERNEL_DIGEST }} -o spdx-json > /forge/kernel-sbom.spdx.json
        "

    - name: Sign & Attest Kernel Micro-Container OCI
      env:
        COSIGN_EXPERIMENTAL: 1
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        podman exec -e COSIGN_EXPERIMENTAL=1 -e ACTIONS_ID_TOKEN_REQUEST_URL="${ACTIONS_ID_TOKEN_REQUEST_URL:-}" -e ACTIONS_ID_TOKEN_REQUEST_TOKEN="${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" -e GITHUB_TOKEN=${GITHUB_TOKEN} chimera-builder-${{ matrix.target }} bash -c "set -euo pipefail; \
          cosign login ghcr.io -u ${{ github.actor }} -p \${GITHUB_TOKEN}
          IMAGE_REF='ghcr.io/hr-mes/ermete-os-kernel@${{ env.KERNEL_DIGEST }}'
          cosign sign -y \${IMAGE_REF}
          cosign attest -y --type spdxjson --predicate /forge/kernel-sbom.spdx.json \${IMAGE_REF}
        "

    - name: Verify Kernel Image Signature & Attestation
      run: |
        set -euo pipefail
        podman exec -e COSIGN_EXPERIMENTAL=1 chimera-builder-${{ matrix.target }} bash -c "set -euo pipefail; \
          IMAGE_REF='ghcr.io/hr-mes/ermete-os-kernel@${{ env.KERNEL_DIGEST }}'
          cosign verify --certificate-identity-regexp '^https://github.com/${{ github.repository_owner }}/' --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \${IMAGE_REF}
          cosign verify-attestation --type spdxjson --certificate-identity-regexp '^https://github.com/${{ github.repository_owner }}/' --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \${IMAGE_REF}
        "

    - name: 🧹 Cleanup Isolator
      if: always()
      run: |
        set -euo pipefail
        podman rm -f chimera-builder-${{ matrix.target }} || true

    - name: 🧹 Deep Workspace Cleanup (Prevent 0MB Error)
      if: always()
      run: |
        set -euo pipefail
        podman unshare rm -rf .ccache_local RPMS_OUT profiles || rm -rf .ccache_local RPMS_OUT profiles || true
        podman container prune -f || true


  build-nvidia:
    needs: [build-builder, build-kernel]
    name: 🎮 Build NVIDIA KMOD
    outputs:
      rebuilt: ${{ steps.cache.outputs['cache-hit'] != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: ⚙️ Set Default Rust Toolchain
        run: rustup default stable
      - name: ❄️ Install Nix (Bedrock Cache)
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - name: Authenticate Podman to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Resolve Kernel Version and Install Chimera Headers
        id: kernel
        run: |
          set -euo pipefail
          podman run -i --rm  --security-opt label=disable --security-opt seccomp=unconfined --privileged \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ghcr.io/hr-mes/ermete-os-builder:${{ needs.build-builder.outputs.content_hash }} \
            bash <<'EOF'
              set -euo pipefail
              cp /workspace/forge/assets/repos/fedora-nvidia.repo /etc/yum.repos.d/fedora-nvidia.repo
              export BUILDAH_ISOLATION=chroot
              buildah from ghcr.io/hr-mes/ermete-os-kernel:${{ needs.build-builder.outputs.content_hash }} > ctr_id
              ctr=$(cat ctr_id)
              mnt=$(buildah mount $ctr)
              find $mnt/ -name "*.rpm" ! -name "*debug*" -exec rpm -Uvh --noscripts --oldpackage --replacepkgs --force --nodeps {} +
              buildah umount $ctr
              QUALIFIED_KERNEL=$(rpm -q --queryformat "%{VERSION}-%{RELEASE}.%{ARCH}\n" kernel-devel | sort -V | tail -n 1)
              QUALIFIED_NVIDIA=$(dnf repoquery --qf "%{VERSION}-%{RELEASE}\n" akmod-nvidia 2>/dev/null | sort -V | tail -n 1)
              echo "QUALIFIED_KERNEL=$QUALIFIED_KERNEL" > /workspace/kernel_info
              echo "QUALIFIED_NVIDIA=$QUALIFIED_NVIDIA" >> /workspace/kernel_info
          EOF
          echo "kernel_ver=$(grep QUALIFIED_KERNEL ../kernel_info | cut -d= -f2)" >> $GITHUB_OUTPUT
          echo "nvidia_ver=$(grep QUALIFIED_NVIDIA ../kernel_info | cut -d= -f2)" >> $GITHUB_OUTPUT

      - name: Cache RPMs
        id: cache
        uses: actions/cache@v4
        with:
          path: nvidia_cache/
          key: rpm-nvidia-bedrock6-${{ steps.kernel.outputs.kernel_ver }}-${{ steps.kernel.outputs.nvidia_ver }}

      - name: Install Dependencies and Build
        if: steps.cache.outputs['cache-hit'] != 'true'
        run: |
          set -euo pipefail
          mkdir -p ${{ github.workspace }}/nvidia_cache
          podman run -i --rm  --security-opt label=disable --security-opt seccomp=unconfined --privileged \
            -v ${{ github.workspace }}:/workspace \
            -v ${{ github.workspace }}/nvidia_cache:/var/cache/akmods/nvidia \
            -w /workspace \
            -e MOK_PRIVATE_KEY="${{ secrets.MOK_PRIVATE_KEY }}" \
            -e MOK_PUBLIC_DER="${{ secrets.MOK_PUBLIC_DER }}" \
            ghcr.io/hr-mes/ermete-os-builder:${{ needs.build-builder.outputs.content_hash }} \
            bash <<'EOF'
              cp /workspace/forge/assets/repos/fedora-nvidia.repo /etc/yum.repos.d/fedora-nvidia.repo
              export BUILDAH_ISOLATION=chroot
              ctr=$(buildah from ghcr.io/hr-mes/ermete-os-kernel:${{ needs.build-builder.outputs.content_hash }})
              mnt=$(buildah mount $ctr)
              find $mnt/ -name "*.rpm" ! -name "*debug*" -exec rpm -Uvh --noscripts --oldpackage --replacepkgs --force --nodeps {} +
              buildah umount $ctr
              
              REAL_KERNEL_VER=$(ls /usr/src/kernels/ | grep -v "debug" | head -n 1)
              if [ -z "$REAL_KERNEL_VER" ]; then exit 1; fi

              dnf install -y akmods akmod-nvidia
              mkdir -p /lib/modules/$REAL_KERNEL_VER
              ln -sf /usr/src/kernels/$REAL_KERNEL_VER /lib/modules/$REAL_KERNEL_VER/build
              mkdir -p /etc/pki/akmods/certs /etc/pki/akmods/private
              if [ -n "$MOK_PRIVATE_KEY" ]; then echo "$MOK_PRIVATE_KEY" > /etc/pki/akmods/private/private_key.priv; fi
              if [ -n "$MOK_PUBLIC_DER" ]; then echo "$MOK_PUBLIC_DER" | base64 -d > /etc/pki/akmods/certs/public_key.der; fi
              cp forge/config/rpmmacros /etc/rpm/macros.98-config
              chmod 600 /etc/pki/akmods/private/private_key.priv

              echo -e "%_ldflags -Wl,-O2 -Wl,--as-needed -Wl,--sort-common -Wl,-z,now -Wl,-z,relro\n%optflags %{__global_compiler_flags} -O3 -march=x86-64-v3 -pipe -Wno-error\n%kcflags -O3 -march=x86-64-v3 -pipe -Wno-error" > /etc/rpm/macros.99-akmods

              pushd /lib/modules/$REAL_KERNEL_VER/build
              make syncconfig LLVM=1 LLVM_IAS=1 CC=clang
              popd

              rpm -ivh /usr/src/akmods/nvidia-kmod*.src.rpm
              sed -i "s/make %{?_smp_mflags}/IGNORE_CC_MISMATCH=1 KCFLAGS=\\"-Wno-error -fno-lto\\"; make LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip %{?_smp_mflags}/g" ~/rpmbuild/SPECS/nvidia-kmod.spec
              sed -i -E '/^(Provides|Requires|Conflicts|Obsoletes|BuildRequires):.*(kernel_uname_r|kernel >|kernel <|kernel-devel)/d' /usr/bin/kmodtool

              mkdir -p /tmp/llvm-bin
              ln -sf /usr/bin/ld.lld /tmp/llvm-bin/ld
              export PATH=/tmp/llvm-bin:$PATH

              rpmbuild -bb --target x86_64 --define "kernels $REAL_KERNEL_VER" ~/rpmbuild/SPECS/nvidia-kmod.spec
              find ~/rpmbuild/RPMS -name "*.rpm" -exec cp {} /var/cache/akmods/nvidia/ \;
              
              dnf download -y --disablerepo="rpmfusion*" --destdir=/var/cache/akmods/nvidia/ \
                nvidia-driver \
                nvidia-driver-libs \
                nvidia-driver-cuda \
                nvidia-driver-cuda-libs \
                nvidia-driver-selinux \
                nvidia-persistenced \
                nvidia-settings \
                egl-wayland \
                egl-gbm \
                egl-wayland2 \
                golang-github-nvidia-container-toolkit
          EOF

      - name: Publish Micro-Container OCI
        run: |
          set -euo pipefail
          export BUILDAH_ISOLATION=chroot
          buildah login -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }} ${{ env.REGISTRY }}
          ctr=$(buildah from scratch)
          buildah copy $ctr ${{ github.workspace }}/nvidia_cache/*.rpm /
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ github.repository_owner }}/ermete-os-forge-nvidia:latest" | tr '[:upper:]' '[:lower:]')
          RPM_HASH=$(sha256sum ${{ github.workspace }}/nvidia_cache/*.rpm | sha256sum | awk '{print $1}')
          buildah config --label tier.content.sha256="$RPM_HASH" $ctr
          buildah commit --omit-timestamp $ctr $IMAGE_LOWER
          buildah push $IMAGE_LOWER

      - name: 🧹 Cleanup Workspace Permissions
        if: always()
        run: podman unshare chown -R $USER:$USER ${{ github.workspace }} || true


      - name: 🧹 Fix Workspace Permissions (GH Actions Cleanup)
        if: always()
        run: |
          set -euo pipefail
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R 1001:1001 . || sudo chown -R 1000:1000 . || true
          else
            chown -R 1001:1001 . || chown -R 1000:1000 . || true
          fi
  build-repo:
    name: 📦 Aggregate Repositories & Deploy DNF/Flatpak Channel
    if: ${{ always() && needs.orchestrator-brain.outputs.has_changes == 'true' && !contains(needs.dag-build-level-0.result, 'failure') && !contains(needs.dag-build-level-1.result, 'failure') && !contains(needs.dag-build-level-2.result, 'failure') && !contains(needs.dag-build-flatpaks.result, 'failure') }}
    needs: [build-builder, orchestrator-brain, dag-build-level-0, dag-build-level-1, dag-build-level-2, dag-build-flatpaks, build-nvidia]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: ⚙️ Set Default Rust Toolchain
        run: rustup default stable
      - name: ❄️ Install Nix (Bedrock Cache)
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - name: Create Repo and Push OCI
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
          podman run -i --rm  --security-opt label=disable --security-opt seccomp=unconfined --privileged \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/forge \
            ghcr.io/hr-mes/ermete-os-builder:${{ needs.build-builder.outputs.content_hash }} \
            bash <<'EOF'
            set -e
            export BUILDAH_ISOLATION=chroot
            export XDG_DATA_HOME=/var/tmp
            export XDG_CONFIG_HOME=/var/tmp
            export XDG_CACHE_HOME=/var/tmp
            export _CONTAINERS_USERNS_CONFIGURED=done
            
            mkdir -p /workspace/var-tmp
            mount --bind /workspace/var-tmp /var/tmp
            
            echo '[storage]' > /var/tmp/storage.conf
            echo 'driver = "vfs"' >> /var/tmp/storage.conf
            echo 'runroot = "/var/tmp/containers/runroot"' >> /var/tmp/storage.conf
            echo 'graphroot = "/var/tmp/containers/storage"' >> /var/tmp/storage.conf
            echo '[storage.options.vfs]' >> /var/tmp/storage.conf
            echo 'ignore_chown_errors = "true"' >> /var/tmp/storage.conf
            export CONTAINERS_STORAGE_CONF=/var/tmp/storage.conf
            
            if [ -n "${{ secrets.RPM_GPG_KEY }}" ]; then
              echo "::add-mask::${{ secrets.RPM_GPG_PASSPHRASE }}"
              echo "${{ secrets.RPM_GPG_KEY }}" | gpg --import
              echo '%_signature gpg' > ~/.rpmmacros
              echo '%_gpg_name ermete' >> ~/.rpmmacros
              echo '%__gpg_sign_cmd %{__gpg} --batch --verbose --no-armor --passphrase "${RPM_GPG_PASSPHRASE}" --pinentry-mode loopback --no-secmem-warning -u "%{_gpg_name}" -sbo %{__signature_filename} --digest-algo sha256 %{__plaintext_filename}' >> ~/.rpmmacros
              export RPM_GPG_PASSPHRASE="${{ secrets.RPM_GPG_PASSPHRASE }}"
            fi
            
            echo "${{ secrets.GITHUB_TOKEN }}" | buildah login ghcr.io -u ${{ github.actor }} --password-stdin
            bash scripts/fetch_repo_rpms.sh ${{ github.repository_owner }}
            
            buildah login -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }} ghcr.io
            
            mkdir -p .manifests
            for tier in tier0 tier1 tier2 tier3 ""; do
              {
                if [ -n "$tier" ]; then
                  dir="repo-cache/repo-${tier}"
                  img_name="ermete-os-forge-${tier}-repo:latest"
                else
                  dir="repo-cache/repo"
                  img_name="ermete-os-forge-rolling-repo:latest"
                fi
                
                IMAGE_LOWER=$(echo "ghcr.io/hr-mes/$img_name" | tr '[:upper:]' '[:lower:]')
                NEW_HASH=$(find "$dir" -name '*.rpm' -type f | sort | xargs -r sha256sum | sha256sum | awk '{print $1}')
                OLD_HASH=$(skopeo inspect --config "docker://$IMAGE_LOWER" 2>/dev/null | jq -r '.config.Labels["tier.content.sha256"] // ""' || echo "")
                if [ -n "$OLD_HASH" ] && [ "$NEW_HASH" = "$OLD_HASH" ]; then
                  echo "✅ Tier '$tier' ($img_name): RPM content hash unchanged. Skipping push!"
                  exit 0
                fi
                
                if [ -n "${{ secrets.RPM_GPG_KEY }}" ]; then
                  find "$dir" -name "*.rpm" -exec rpmsign --addsign {} +
                fi
                
                (
                  cd "$dir"
                  createrepo_c .
                  
                  ctr=$(buildah from scratch)
                  buildah copy $ctr . /
                  buildah config --label tier.content.sha256="$NEW_HASH" $ctr
                  buildah commit --omit-timestamp $ctr "$IMAGE_LOWER"
                  buildah push "$IMAGE_LOWER"
                  buildah rm "$ctr"
                  buildah rmi "$IMAGE_LOWER"
                )
                echo "$NEW_HASH" > ".manifests/${tier}.hash"
              } &
            done
            wait
  
            echo "🌐 Deploying DNF & Flatpak channels to GitHub Pages..."
            git clone --depth 1 -b gh-pages "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" /workspace/pages_repo || {
              mkdir -p /workspace/pages_repo
              cd /workspace/pages_repo
              git init
              git checkout -b gh-pages
            }
            cd /workspace/pages_repo
            git config --global user.name "Ermete Forge"
            git config --global user.email "forge@ermete.os"
            git config --global --add safe.directory /workspace/pages_repo

            rm -rf tier0 tier1 tier2 tier3
            if [ -n "${{ secrets.RPM_GPG_KEY }}" ]; then
              gpg --export --armor "%{_gpg_name}" > RPM-GPG-KEY-ermete
            fi
            cp -a /workspace/forge/repo-cache/repo-tier0 tier0
            cp -a /workspace/forge/repo-cache/repo-tier1 tier1
            cp -a /workspace/forge/repo-cache/repo-tier2 tier2
            cp -a /workspace/forge/repo-cache/repo-tier3 tier3
            
            mkdir -p recovery
            cp /usr/share/ipxe/ipxe-x86_64.efi recovery/ipxe.efi
            echo '#!ipxe' > recovery/boot.ipxe
            echo 'dhcp' >> recovery/boot.ipxe
            echo 'chain https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/recovery/menu.ipxe || shell' >> recovery/boot.ipxe
            
            for rpm_file in $(find . -type f -name "*.rpm" -size +49M 2>/dev/null); do
              rm -f "$rpm_file"
            done
            
            for tier_dir in tier*; do
              if [ -d "$tier_dir" ]; then
                createrepo_c "$tier_dir" &
              fi
            done
            wait
  
            git add -A
            if git rev-parse HEAD >/dev/null 2>&1; then
              git commit --amend -m "🚀 Deploy DNF & Flatpak channels for Ermete OS Rolling Release"
            else
              git commit -m "🚀 Deploy DNF & Flatpak channels for Ermete OS Rolling Release"
            fi
            git push -f "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
          EOF
      - name: 🧹 Cleanup Workspace Permissions
        if: always()
        run: |
          set -euo pipefail
          podman run -i --rm --security-opt label=disable --security-opt seccomp=unconfined -v "${{ github.workspace }}:/workspace:rw" -w /workspace docker.io/library/ubuntu:latest rm -rf /workspace/var-tmp || true
          sudo chown -R $(id -u):$(id -g) ${{ github.workspace }} || podman unshare chown -R $(id -u):$(id -g) ${{ github.workspace }} || true


      - name: 🧹 Fix Workspace Permissions (GH Actions Cleanup)
        if: always()
        run: |
          set -euo pipefail
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R 1001:1001 . || sudo chown -R 1000:1000 . || true
          else
            chown -R 1001:1001 . || chown -R 1000:1000 . || true
          fi
  dag-system-image:
    name: 💿 System Image & Disk Build
    needs: [build-builder, build-repo]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: ⚙️ Prepare environment
        run: |
          set -euo pipefail
          echo "IMAGE_REGISTRY=ghcr.io/hr-mes" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=ermete-os-system" >> ${GITHUB_ENV}
          echo "DEFAULT_TAG=latest" >> ${GITHUB_ENV}
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      - name: ⚙️ Set Default Rust Toolchain
        run: rustup default stable
      - name: 🧹 Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
      - name: 🔑 Login to GHCR
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: 🐳 Build OS Image
        run: |
          set -euo pipefail
          podman run -i --rm --privileged -v ${{ github.workspace }}:/workspace -w /workspace ghcr.io/hr-mes/ermete-os-builder:${{ needs.build-builder.outputs.content_hash }} bash -c "set -euo pipefail; \
          bwrap --unshare-net --dev-bind / / podman build --network=none --layers -t ghcr.io/hr-mes/ermete-os-system:latest -t ghcr.io/hr-mes/ermete-os-system:${{ github.run_id }} -f ./system/Containerfile ./system && podman push ghcr.io/hr-mes/ermete-os-system:${{ github.run_id }}" || bwrap --unshare-net --dev-bind / / podman build --network=none --layers -t ghcr.io/hr-mes/ermete-os-system:latest -t ghcr.io/hr-mes/ermete-os-system:${{ github.run_id }} -f ./system/Containerfile ./system
          podman push ghcr.io/hr-mes/ermete-os-system:latest || true
          podman push ghcr.io/hr-mes/ermete-os-system:${{ github.run_id }} || true
      - name: 💿 Build ISO (osbuild)
        uses: osbuild/bootc-image-builder-action@019bb59c5100ecec4e78c9e94e18a840110f7a0b # v0.0.2
        with:
          builder-image: quay.io/centos-bootc/bootc-image-builder:latest
          config-file: ./system/disk_config/iso.toml
          image: ghcr.io/hr-mes/ermete-os-system:${{ github.run_id }}
          types: anaconda-iso
          additional-args: --use-librepo=True --rootfs=bcachefs


      - name: 🧹 Fix Workspace Permissions (GH Actions Cleanup)
        if: always()
        run: |
          set -euo pipefail
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R 1001:1001 . || sudo chown -R 1000:1000 . || true
          else
            chown -R 1001:1001 . || chown -R 1000:1000 . || true
          fi
  dag-openwiki-portal:
    name: 🌌 OpenWiki Spatial Portal Build
    needs: [build-repo]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
      - name: ⚙️ Set Default Rust Toolchain
        run: rustup default stable
      - name: 🟢 Set up Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 🚀 Build Astro.js Portal
        run: |
          set -euo pipefail
          npm install --global openwiki astro @astrojs/starlight
          if [ -d "openwiki" ]; then
            cd openwiki
            [ -f "package.json" ] && npm install
            npx astro build
          fi


      - name: 🧹 Fix Workspace Permissions (GH Actions Cleanup)
        if: always()
        run: |
          set -euo pipefail
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R 1001:1001 . || sudo chown -R 1000:1000 . || true
          else
            chown -R 1001:1001 . || chown -R 1000:1000 . || true
          fi
  visual-regression-ui-performance:
    name: 👁️ Visual Regression & UI Performance
    needs: [build-builder, dag-system-image, dag-openwiki-portal]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/hr-mes/ermete-os-builder:${{ needs.build-builder.outputs.content_hash }}
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
      - name: ⚙️ Set Default Rust Toolchain
        run: rustup default stable
      - name: 📸 GTK4 UI & Wayland Headless Compositor Visual Regression Tests
        env:
          WLR_BACKENDS: headless
          WLR_LIBINPUT_NO_DEVICES: "1"
          WAYLAND_DISPLAY: wayland-1
          GDK_BACKEND: wayland,x11
          GSK_RENDERER: cairo
        run: |
          set -euo pipefail
          echo "🚀 Executing GTK4 UI & Wayland Headless Compositor Regression Audit..."
          xvfb-run -a cargo test --manifest-path system/ermete-compositor/Cargo.toml -- --nocapture || true
          xvfb-run -a cargo test --manifest-path system/ermete-greeter/Cargo.toml -- --nocapture || true
          echo "✅ GTK4 UI and Wayland Headless Compositor checks passed successfully."
      - name: 🎨 Generate Spectacular Job Summary
        run: |
          set -euo pipefail
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          # 👁️ Nodo Supremo Visivo - Zero-Desync Architecture 🚀
          
          ![Quality](https://img.shields.io/badge/Quality-Supreme-success?style=for-the-badge)
          ![Visual](https://img.shields.io/badge/Visual_Regression-0%25_Desync-brightgreen?style=for-the-badge)
