# Force trigger to wake up GitHub Actions
name: Ermete Forge Orchestrator

on:
  push:
    branches: [ main ]
    paths:
      - 'forge/**'
      - '.github/workflows/ermete-forge-orchestrator.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

env:
  REGISTRY: ghcr.io
  FEDORA_VERSION: 43
  RUSTC_WRAPPER: sccache
  SCCACHE_DIRECT: "true"
  SCCACHE_CACHE_SIZE: "10G"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  orchestrator-brain:
    name: 🧠 DAG Orchestrator Brain & Distributed Cache
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: forge
    outputs:
      dag_level_0: ${{ steps.brain.outputs.dag_level_0 }}
      dag_level_1: ${{ steps.brain.outputs.dag_level_1 }}
      dag_level_2: ${{ steps.brain.outputs.dag_level_2 }}
      dag_flatpaks: ${{ steps.brain.outputs.dag_flatpaks }}
      dirty_count: ${{ steps.brain.outputs.dirty_count }}
      has_changes: ${{ steps.brain.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
      - name: ⚙️ Set Default Rust Toolchain
        run: rustup default stable
      - name: Align Repositories
        run: cp builder/rpmfusion-custom.repo /etc/yum.repos.d/ 2>/dev/null || true
      - name: Persist DAG State Cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: dag-cache-${{ github.run_id }}
          restore-keys: |
            dag-cache-

      - name: Compute Dependency DAG & Topological Matrix
        id: brain
        run: ./scripts/dynamic-matrix.sh

      - name: 🧹 Cleanup Workspace Permissions
        if: always()
        run: podman unshare chown -R $USER:$USER ${{ github.workspace }} || true


      - name: 🧹 Fix Workspace Permissions (GH Actions Cleanup)
        if: always()
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R 1001:1001 . || sudo chown -R 1000:1000 . || true
          else
            chown -R 1001:1001 . || chown -R 1000:1000 . || true
          fi
  build-builder:
    name: 🏗️ Build Base Builder
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: forge
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: ⚙️ Set Default Rust Toolchain
        run: rustup default stable
      - name: Check Idempotency (Content Hash)
        id: check_idempotency
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
          podman run -i --rm  --security-opt label=disable --security-opt seccomp=unconfined --privileged -e GITHUB_TOKEN="${GITHUB_TOKEN}" -v ${{ github.workspace }}:/workspace -w /workspace/forge ghcr.io/hr-mes/ermete-os-builder:latest bash scripts/check_idempotency.sh --package builder --registry ghcr.io --owner ${{ github.repository_owner }} --image-name ermete-os-builder > idemp.out
          source ./idemp.out
          if [ "$CACHE_HIT" = "true" ]; then
            echo "cache_hit=true" >> $GITHUB_OUTPUT
          else
            echo "cache_hit=false" >> $GITHUB_OUTPUT
          fi
          echo "content_hash=$CONTENT_HASH" >> $GITHUB_OUTPUT

      - name: Build and Publish Builder
        if: steps.check_idempotency.outputs.cache_hit != 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ github.repository_owner }}/ermete-os-builder" | tr '[:upper:]' '[:lower:]')
          podman build --security-opt label=disable --security-opt seccomp=unconfined -t $IMAGE_LOWER:latest -f builder/Containerfile builder/
          podman tag $IMAGE_LOWER:latest $IMAGE_LOWER:${{ steps.check_idempotency.outputs.content_hash }}
          podman push $IMAGE_LOWER:latest
          podman push $IMAGE_LOWER:${{ steps.check_idempotency.outputs.content_hash }}

      - name: 🧹 Cleanup Workspace Permissions
        if: always()
        run: podman unshare chown -R $USER:$USER ${{ github.workspace }} || true


      - name: 🧹 Fix Workspace Permissions (GH Actions Cleanup)
        if: always()
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R 1001:1001 . || sudo chown -R 1000:1000 . || true
          else
            chown -R 1001:1001 . || chown -R 1000:1000 . || true
          fi
  dag-build-level-0:
    needs: [build-builder, orchestrator-brain]
    if: needs.orchestrator-brain.outputs.dag_level_0 != '[]' && needs.orchestrator-brain.outputs.dag_level_0 != ''
    name: ⚡ DAG Level 0 Parallel Build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        package: ${{ fromJson(needs.orchestrator-brain.outputs.dag_level_0) }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: ⚙️ Set Default Rust Toolchain
        run: rustup default stable
      - name: Check Idempotency (GHCR Cache)
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
          img_name="ermete-os-forge-${{ matrix.package }}"
          if [ ! -d "specs/ermete-${{ matrix.package }}" ]; then
            img_name="ermete-os-forge-rolling-${{ matrix.package }}"
          fi
          podman run -i --rm  --security-opt label=disable --security-opt seccomp=unconfined --privileged -e GITHUB_TOKEN="${GITHUB_TOKEN}" -v ${{ github.workspace }}:/workspace -w /workspace/forge ghcr.io/hr-mes/ermete-os-builder:latest bash scripts/check_idempotency.sh --package ${{ matrix.package }} --registry ${{ env.REGISTRY }} --owner ${{ github.repository_owner }} --image-name $img_name > idemp.out
          source ./idemp.out
          echo "hash=$CONTENT_HASH" >> $GITHUB_OUTPUT
          if [ "$CACHE_HIT" = "true" ]; then echo "skip=true" >> $GITHUB_OUTPUT; else echo "skip=false" >> $GITHUB_OUTPUT; fi

      - name: Extreme Rust Cache (LLVM & Dependencies)
        if: steps.check.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "sccache-level0-${{ matrix.package }}"
          cache-on-failure: "true"

      - name: Cache sccache
        if: steps.check.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: .sccache
          key: sccache-${{ matrix.package }}-${{ runner.os }}-${{ hashFiles(format('forge/specs/ermete-{0}/**', matrix.package)) }}
          restore-keys: |
            sccache-${{ matrix.package }}-

      - name: Build Package (Custom Spec or Upstream SRPM)
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p RPMS
          mkdir -p ${{ github.workspace }}/.sccache
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
          
          if [ -d "specs/ermete-${{ matrix.package }}" ]; then
            echo "📦 Compiling Custom Spec: ermete-${{ matrix.package }}"
            podman run -i --rm \
              -v ${{ github.workspace }}:/workspace \
              -v ${{ github.workspace }}/.sccache:/root/.cache/sccache \
              -w /workspace/forge \
              ghcr.io/hr-mes/ermete-os-builder:latest \
              bash <<'EOF'
              cp config/rpmmacros ~/.rpmmacros
              rpmdev-setuptree
            
              if [ -d "specs/ermete-${{ matrix.package }}/SOURCES" ]; then 
                cp -a specs/ermete-${{ matrix.package }}/SOURCES/* ~/rpmbuild/SOURCES/ || true
              fi

              for dir in specs/ermete-${{ matrix.package }}/*/ ; do
                if [ -d "$dir" ] && [ "$(basename "$dir")" != "SOURCES" ]; then
                  pkg_dir=$(basename "$dir")
                  tar -czf ~/rpmbuild/SOURCES/${pkg_dir}.tar.gz -C specs/ermete-${{ matrix.package }} ${pkg_dir}
                fi
              done
            
              dnf builddep -y specs/ermete-${{ matrix.package }}/*.spec
              spectool -g -R specs/ermete-${{ matrix.package }}/*.spec || true
            
              mkdir -p ~/rpmbuild/BUILD/
              for spec_dir in /workspace/forge/specs/ermete-*/ ; do
                if [ -d "$spec_dir" ]; then
                  crate_name=$(basename "$spec_dir")
                  mkdir -p ~/rpmbuild/BUILD/"$crate_name"
                  cp -a "$spec_dir"/. ~/rpmbuild/BUILD/"$crate_name"/ 2>/dev/null || true
                fi
              done
   
              rpmbuild -bb specs/ermete-${{ matrix.package }}/*.spec || true
            
              if ls ~/rpmbuild/SRPMS/*.nosrc.rpm 1> /dev/null 2>&1; then
                  dnf builddep -y --exclude="noopenh264*" ~/rpmbuild/SRPMS/*.nosrc.rpm
              fi
            
              rpmbuild -bb specs/ermete-${{ matrix.package }}/*.spec
              mkdir -p /workspace/forge/RPMS
              cp ~/rpmbuild/RPMS/*/*.rpm /workspace/forge/RPMS/
          EOF
          else
            echo "🌐 Compiling Upstream Package: ${{ matrix.package }}"
            podman run -i --rm  --security-opt label=disable --security-opt seccomp=unconfined --privileged \
              -v ${{ github.workspace }}:/workspace \
              -v ${{ github.workspace }}/.sccache:/root/.cache/sccache \
              -w /workspace/forge \
              ghcr.io/hr-mes/ermete-os-builder:latest \
              bash <<'EOF'
              cp config/rpmmacros ~/.rpmmacros
              rpmdev-setuptree
              cd ~/rpmbuild/SRPMS
              dnf download --source ${{ matrix.package }} || dnf download --source --disablerepo="rpmfusion*" ${{ matrix.package }}
              rpm -ivh *.src.rpm
              dnf builddep -y --allowerasing ~/rpmbuild/SPECS/*.spec
              rpmbuild -bb ~/rpmbuild/SPECS/*.spec
              mkdir -p /workspace/forge/RPMS
              cp ~/rpmbuild/RPMS/*/*.rpm /workspace/forge/RPMS/
          EOF
          fi

      - name: Publish Micro-Container OCI
        if: steps.check.outputs.skip != 'true'
        run: |
          export BUILDAH_ISOLATION=chroot
          buildah login -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }} ${{ env.REGISTRY }}
          ctr=$(buildah from scratch)
          buildah copy $ctr RPMS/*.rpm /
          
          img_prefix="ermete-os-forge"
          if [ ! -d "specs/ermete-${{ matrix.package }}" ]; then
            img_prefix="ermete-os-forge-rolling"
          fi
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ github.repository_owner }}/${img_prefix}-${{ matrix.package }}" | tr '[:upper:]' '[:lower:]')
          buildah config --label tier.content.sha256="${{ steps.check.outputs.hash }}" $ctr
          buildah commit --omit-timestamp $ctr $IMAGE_LOWER:latest
          buildah tag $IMAGE_LOWER:latest $IMAGE_LOWER:${{ steps.check.outputs.hash }}
          buildah push $IMAGE_LOWER:latest
          buildah push $IMAGE_LOWER:${{ steps.check.outputs.hash }}
          


      - name: Install Syft & Cosign
        if: steps.check.outputs.skip != 'true'
        run: |
          curl -sSfL -o /tmp/syft-install.sh https://raw.githubusercontent.com/anchore/syft/main/install.sh
          echo "ea054f8b6754db17d34129482ecda1ab733cadab57c1c9202bbe98eb5fe18d24  /tmp/syft-install.sh" | sha256sum -c
          sudo sh /tmp/syft-install.sh -b /usr/local/bin
          rm -f /tmp/syft-install.sh
          curl -fsSL -o /tmp/cosign-linux-amd64 https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64
          echo "4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71  /tmp/cosign-linux-amd64" | sha256sum -c
          sudo mv /tmp/cosign-linux-amd64 /usr/local/bin/cosign
          sudo chmod +x /usr/local/bin/cosign

      - name: Generate SBOM (Syft)
        if: steps.check.outputs.skip != 'true'
        run: |
          img_prefix="ermete-os-forge"
          if [ ! -d "specs/ermete-${{ matrix.package }}" ]; then
            img_prefix="ermete-os-forge-rolling"
          fi
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ github.repository_owner }}/${img_prefix}-${{ matrix.package }}:latest" | tr "[:upper:]" "[:lower:]")
          syft packages $IMAGE_LOWER -o spdx-json=sbom-${{ matrix.package }}.spdx.json

      - name: Sign & Attest Micro-Container
        if: steps.check.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cosign login ${{ env.REGISTRY }} -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
          img_prefix="ermete-os-forge"
          if [ ! -d "specs/ermete-${{ matrix.package }}" ]; then
            img_prefix="ermete-os-forge-rolling"
          fi
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ github.repository_owner }}/${img_prefix}-${{ matrix.package }}:latest" | tr '[:upper:]' '[:lower:]')
          cosign sign --yes $IMAGE_LOWER
          cosign attest --yes --type spdxjson --predicate sbom-${{ matrix.package }}.spdx.json $IMAGE_LOWER

      - name: 🧹 Cleanup Workspace Permissions
        if: always()
        run: podman unshare chown -R $USER:$USER ${{ github.workspace }} || true


      - name: 🧹 Fix Workspace Permissions (GH Actions Cleanup)
        if: always()
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R 1001:1001 . || sudo chown -R 1000:1000 . || true
          else
            chown -R 1001:1001 . || chown -R 1000:1000 . || true
          fi
  dag-build-level-1:
    needs: [build-builder, orchestrator-brain, dag-build-level-0]
    if: always() && needs.orchestrator-brain.outputs.dag_level_1 != '[]' && needs.orchestrator-brain.outputs.dag_level_1 != '' && !contains(needs.dag-build-level-0.result, 'failure')
    name: ⚡ DAG Level 1 Parallel Build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        package: ${{ fromJson(needs.orchestrator-brain.outputs.dag_level_1) }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: ⚙️ Set Default Rust Toolchain
        run: rustup default stable
      - name: Check Idempotency (GHCR Cache)
        id: check
        env:
