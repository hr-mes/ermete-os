      - name: Sign & Attest Micro-Container
        if: steps.check.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cosign login ${{ env.REGISTRY }} -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
          img_prefix="ermete-os-forge"
          if [ ! -d "specs/ermete-${{ matrix.package }}" ]; then
            img_prefix="ermete-os-forge-rolling"
          fi
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ github.repository_owner }}/${img_prefix}-${{ matrix.package }}:latest" | tr '[:upper:]' '[:lower:]')
          cosign sign --yes $IMAGE_LOWER
          cosign attest --yes --type spdxjson --predicate sbom-${{ matrix.package }}.spdx.json $IMAGE_LOWER

      - name: 🧹 Cleanup Workspace Permissions
        if: always()
        run: podman unshare chown -R $USER:$USER ${{ github.workspace }} || true


      - name: 🧹 Fix Workspace Permissions (GH Actions Cleanup)
        if: always()
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R 1001:1001 . || sudo chown -R 1000:1000 . || true
          else
            chown -R 1001:1001 . || chown -R 1000:1000 . || true
          fi
  dag-build-level-2:
    needs: [build-builder, orchestrator-brain, dag-build-level-1]
    if: always() && needs.orchestrator-brain.outputs.dag_level_2 != '[]' && needs.orchestrator-brain.outputs.dag_level_2 != '' && !contains(needs.dag-build-level-1.result, 'failure')
    name: ⚡ DAG Level 2 Parallel Build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        package: ${{ fromJson(needs.orchestrator-brain.outputs.dag_level_2) }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: ⚙️ Set Default Rust Toolchain
        run: rustup default stable
      - name: Check Idempotency (GHCR Cache)
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
          img_name="ermete-os-forge-${{ matrix.package }}"
          if [ ! -d "specs/ermete-${{ matrix.package }}" ]; then img_name="ermete-os-forge-rolling-${{ matrix.package }}"; fi
          podman run -i --rm  --security-opt label=disable --security-opt seccomp=unconfined --privileged -e GITHUB_TOKEN="${GITHUB_TOKEN}" -v ${{ github.workspace }}:/workspace -w /workspace/forge ghcr.io/hr-mes/ermete-os-builder:latest bash scripts/check_idempotency.sh --package ${{ matrix.package }} --registry ${{ env.REGISTRY }} --owner ${{ github.repository_owner }} --image-name $img_name > idemp.out
          source ./idemp.out
          echo "hash=$CONTENT_HASH" >> $GITHUB_OUTPUT
          if [ "$CACHE_HIT" = "true" ]; then echo "skip=true" >> $GITHUB_OUTPUT; else echo "skip=false" >> $GITHUB_OUTPUT; fi

      - name: Extreme Rust Cache (LLVM & Dependencies)
        if: steps.check.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "sccache-level2-${{ matrix.package }}"
          cache-on-failure: "true"

      - name: Cache sccache
        if: steps.check.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: .sccache
          key: sccache-${{ matrix.package }}-${{ runner.os }}-${{ hashFiles(format('forge/specs/ermete-{0}/**', matrix.package)) }}
          restore-keys: |
            sccache-${{ matrix.package }}-

      - name: Build Package (Custom Spec or Upstream SRPM)
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p RPMS
          mkdir -p ${{ github.workspace }}/.sccache
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
          
          if [ -d "specs/ermete-${{ matrix.package }}" ]; then
            echo "📦 Compiling Custom Spec: ermete-${{ matrix.package }}"
            podman run -i --rm --security-opt label=disable --security-opt seccomp=unconfined --privileged \
              -v ${{ github.workspace }}:/workspace \
              -v ${{ github.workspace }}/.sccache:/root/.cache/sccache \
              -w /workspace/forge \
              ghcr.io/hr-mes/ermete-os-builder:latest \
              bash <<'EOF'
              cp config/rpmmacros ~/.rpmmacros
              rpmdev-setuptree
            
              if [ -d "specs/ermete-${{ matrix.package }}/SOURCES" ]; then 
                cp -a specs/ermete-${{ matrix.package }}/SOURCES/* ~/rpmbuild/SOURCES/ || true
              fi
            
              for dir in specs/ermete-${{ matrix.package }}/*/ ; do
                if [ -d "$dir" ] && [ "$(basename "$dir")" != "SOURCES" ]; then
                  pkg_dir=$(basename "$dir")
                  tar -czf ~/rpmbuild/SOURCES/${pkg_dir}.tar.gz -C specs/ermete-${{ matrix.package }} ${pkg_dir}
                fi
              done
            
              dnf builddep -y specs/ermete-${{ matrix.package }}/*.spec
              spectool -g -R specs/ermete-${{ matrix.package }}/*.spec || true
            
              mkdir -p ~/rpmbuild/BUILD/
              for spec_dir in /workspace/forge/specs/ermete-*/ ; do
                if [ -d "$spec_dir" ]; then
                  crate_name=$(basename "$spec_dir")
                  mkdir -p ~/rpmbuild/BUILD/"$crate_name"
                  cp -a "$spec_dir"/. ~/rpmbuild/BUILD/"$crate_name"/ 2>/dev/null || true
                fi
              done
   
              rpmbuild -bb specs/ermete-${{ matrix.package }}/*.spec || true
            
              if ls ~/rpmbuild/SRPMS/*.nosrc.rpm 1> /dev/null 2>&1; then
                  dnf builddep -y --exclude="noopenh264*" ~/rpmbuild/SRPMS/*.nosrc.rpm
              fi
            
              rpmbuild -bb specs/ermete-${{ matrix.package }}/*.spec
              mkdir -p /workspace/forge/RPMS
              cp ~/rpmbuild/RPMS/*/*.rpm /workspace/forge/RPMS/
          EOF
          else
            echo "🌐 Compiling Upstream Package: ${{ matrix.package }}"
            podman run -i --rm --security-opt label=disable --security-opt seccomp=unconfined --privileged \
              -v ${{ github.workspace }}:/workspace \
              -v ${{ github.workspace }}/.sccache:/root/.cache/sccache \
              -w /workspace/forge \
              ghcr.io/hr-mes/ermete-os-builder:latest \
              bash <<'EOF'
              cp config/rpmmacros ~/.rpmmacros
              rpmdev-setuptree
              cd ~/rpmbuild/SRPMS
              dnf download --source ${{ matrix.package }} || dnf download --source --disablerepo="rpmfusion*" ${{ matrix.package }}
              rpm -ivh *.src.rpm
              dnf builddep -y --allowerasing ~/rpmbuild/SPECS/*.spec
              rpmbuild -bb ~/rpmbuild/SPECS/*.spec
              mkdir -p /workspace/forge/RPMS
              cp ~/rpmbuild/RPMS/*/*.rpm /workspace/forge/RPMS/
          EOF
          fi

      - name: Publish Micro-Container OCI
        if: steps.check.outputs.skip != 'true'
        run: |
          export BUILDAH_ISOLATION=chroot
          buildah login -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }} ${{ env.REGISTRY }}
          ctr=$(buildah from scratch)
          buildah copy $ctr RPMS/*.rpm /
          
          img_prefix="ermete-os-forge"
          if [ ! -d "specs/ermete-${{ matrix.package }}" ]; then
            img_prefix="ermete-os-forge-rolling"
          fi
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ github.repository_owner }}/${img_prefix}-${{ matrix.package }}" | tr '[:upper:]' '[:lower:]')
          buildah config --label tier.content.sha256="${{ steps.check.outputs.hash }}" $ctr
          buildah commit --omit-timestamp $ctr $IMAGE_LOWER:latest
          buildah tag $IMAGE_LOWER:latest $IMAGE_LOWER:${{ steps.check.outputs.hash }}
          buildah push $IMAGE_LOWER:latest
          buildah push $IMAGE_LOWER:${{ steps.check.outputs.hash }}
          


      - name: Install Syft & Cosign
        if: steps.check.outputs.skip != 'true'
        run: |
          curl -sSfL -o /tmp/syft-install.sh https://raw.githubusercontent.com/anchore/syft/main/install.sh
          echo "ea054f8b6754db17d34129482ecda1ab733cadab57c1c9202bbe98eb5fe18d24  /tmp/syft-install.sh" | sha256sum -c
          sudo sh /tmp/syft-install.sh -b /usr/local/bin
          rm -f /tmp/syft-install.sh
          curl -fsSL -o /tmp/cosign-linux-amd64 https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64
          echo "4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71  /tmp/cosign-linux-amd64" | sha256sum -c
          sudo mv /tmp/cosign-linux-amd64 /usr/local/bin/cosign
          sudo chmod +x /usr/local/bin/cosign

      - name: Generate SBOM (Syft)
        if: steps.check.outputs.skip != 'true'
        run: |
          img_prefix="ermete-os-forge"
          if [ ! -d "specs/ermete-${{ matrix.package }}" ]; then
            img_prefix="ermete-os-forge-rolling"
          fi
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ github.repository_owner }}/${img_prefix}-${{ matrix.package }}:latest" | tr "[:upper:]" "[:lower:]")
          syft packages $IMAGE_LOWER -o spdx-json=sbom-${{ matrix.package }}.spdx.json

      - name: Sign & Attest Micro-Container
        if: steps.check.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cosign login ${{ env.REGISTRY }} -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
          img_prefix="ermete-os-forge"
          if [ ! -d "specs/ermete-${{ matrix.package }}" ]; then
            img_prefix="ermete-os-forge-rolling"
          fi
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ github.repository_owner }}/${img_prefix}-${{ matrix.package }}:latest" | tr '[:upper:]' '[:lower:]')
          cosign sign --yes $IMAGE_LOWER
          cosign attest --yes --type spdxjson --predicate sbom-${{ matrix.package }}.spdx.json $IMAGE_LOWER

      - name: 🧹 Cleanup Workspace Permissions
        if: always()
        run: podman unshare chown -R $USER:$USER ${{ github.workspace }} || true


      - name: 🧹 Fix Workspace Permissions (GH Actions Cleanup)
        if: always()
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R 1001:1001 . || sudo chown -R 1000:1000 . || true
          else
            chown -R 1001:1001 . || chown -R 1000:1000 . || true
          fi
  dag-build-flatpaks:
    needs: [build-builder, orchestrator-brain, dag-build-level-2]
    if: always() && needs.orchestrator-brain.outputs.dag_flatpaks != '[]' && needs.orchestrator-brain.outputs.dag_flatpaks != '' && !contains(needs.dag-build-level-2.result, 'failure')
    name: 📦 DAG Flatpaks Parallel Build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        flatpak: ${{ fromJson(needs.orchestrator-brain.outputs.dag_flatpaks) }}
    steps:
      - uses: actions/checkout@v4
      - name: ⚙️ Set Default Rust Toolchain
        run: rustup default stable
      - name: Build & Validate Flatpak Package
        run: |
          echo "📦 [DAG Flatpak Orchestrator] Validating & Pre-fetching Flatpak metadata for: ${{ matrix.flatpak }}"
          curl -sI "https://dl.flathub.org/repo/appstream/x86_64/issues/${{ matrix.flatpak }}.json" || true
          echo "✅ Declarative Flatpak layer validation completed for ${{ matrix.flatpak }}"


      - name: 🧹 Fix Workspace Permissions (GH Actions Cleanup)
        if: always()
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R 1001:1001 . || sudo chown -R 1000:1000 . || true
          else
            chown -R 1001:1001 . || chown -R 1000:1000 . || true
          fi
  build-nvidia:
    needs: [build-builder]
    name: 🎮 Build NVIDIA KMOD
    outputs:
      rebuilt: ${{ steps.cache.outputs['cache-hit'] != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: ⚙️ Set Default Rust Toolchain
        run: rustup default stable
      - name: Authenticate Podman to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Resolve Kernel Version and Install Chimera Headers
        id: kernel
        run: |
          podman run -i --rm  --security-opt label=disable --security-opt seccomp=unconfined --privileged \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ghcr.io/hr-mes/ermete-os-builder:latest \
            bash <<'EOF'
              set -euo pipefail
              curl -sLo /tmp/fedora-nvidia.repo https://negativo17.org/repos/fedora-nvidia.repo
              echo "9126880310a20437de6ba1a83d299ee9a2119f8a1ef1e40de601676054320fc5  /tmp/fedora-nvidia.repo" | sha256sum -c
              cp /tmp/fedora-nvidia.repo /etc/yum.repos.d/fedora-nvidia.repo
              export BUILDAH_ISOLATION=chroot
              buildah from ghcr.io/hr-mes/ermete-os-kernel:latest > ctr_id
              ctr=$(cat ctr_id)
              mnt=$(buildah mount $ctr)
              find $mnt/ -name "*.rpm" ! -name "*debug*" -exec rpm -Uvh --noscripts --oldpackage --replacepkgs --force --nodeps {} +
              buildah umount $ctr
              QUALIFIED_KERNEL=$(rpm -q --queryformat "%{VERSION}-%{RELEASE}.%{ARCH}\n" kernel-devel | sort -V | tail -n 1)
              QUALIFIED_NVIDIA=$(dnf repoquery --qf "%{VERSION}-%{RELEASE}\n" akmod-nvidia 2>/dev/null | sort -V | tail -n 1)
              echo "QUALIFIED_KERNEL=$QUALIFIED_KERNEL" > /workspace/kernel_info
              echo "QUALIFIED_NVIDIA=$QUALIFIED_NVIDIA" >> /workspace/kernel_info
          EOF
          echo "kernel_ver=$(grep QUALIFIED_KERNEL ../kernel_info | cut -d= -f2)" >> $GITHUB_OUTPUT
          echo "nvidia_ver=$(grep QUALIFIED_NVIDIA ../kernel_info | cut -d= -f2)" >> $GITHUB_OUTPUT

      - name: Cache RPMs
        id: cache
        uses: actions/cache@v4
        with:
          path: nvidia_cache/
          key: rpm-nvidia-bedrock6-${{ steps.kernel.outputs.kernel_ver }}-${{ steps.kernel.outputs.nvidia_ver }}

      - name: Install Dependencies and Build
        if: steps.cache.outputs['cache-hit'] != 'true'
        run: |
          mkdir -p ${{ github.workspace }}/nvidia_cache
          podman run -i --rm  --security-opt label=disable --security-opt seccomp=unconfined --privileged \
            -v ${{ github.workspace }}:/workspace \
            -v ${{ github.workspace }}/nvidia_cache:/var/cache/akmods/nvidia \
            -w /workspace \
            -e MOK_PRIVATE_KEY="${{ secrets.MOK_PRIVATE_KEY }}" \
            -e MOK_PUBLIC_DER="${{ secrets.MOK_PUBLIC_DER }}" \
            ghcr.io/hr-mes/ermete-os-builder:latest \
            bash <<'EOF'
              curl -sLo /tmp/fedora-nvidia.repo https://negativo17.org/repos/fedora-nvidia.repo
              echo "9126880310a20437de6ba1a83d299ee9a2119f8a1ef1e40de601676054320fc5  /tmp/fedora-nvidia.repo" | sha256sum -c
              cp /tmp/fedora-nvidia.repo /etc/yum.repos.d/fedora-nvidia.repo
              export BUILDAH_ISOLATION=chroot
              ctr=$(buildah from ghcr.io/hr-mes/ermete-os-kernel:latest)
              mnt=$(buildah mount $ctr)
              find $mnt/ -name "*.rpm" ! -name "*debug*" -exec rpm -Uvh --noscripts --oldpackage --replacepkgs --force --nodeps {} +
              buildah umount $ctr
              
              REAL_KERNEL_VER=$(ls /usr/src/kernels/ | grep -v "debug" | head -n 1)
              if [ -z "$REAL_KERNEL_VER" ]; then exit 1; fi

              dnf install -y akmods akmod-nvidia
              mkdir -p /lib/modules/$REAL_KERNEL_VER
              ln -sf /usr/src/kernels/$REAL_KERNEL_VER /lib/modules/$REAL_KERNEL_VER/build
              mkdir -p /etc/pki/akmods/certs /etc/pki/akmods/private
              if [ -n "$MOK_PRIVATE_KEY" ]; then echo "$MOK_PRIVATE_KEY" > /etc/pki/akmods/private/private_key.priv; fi
              if [ -n "$MOK_PUBLIC_DER" ]; then echo "$MOK_PUBLIC_DER" | base64 -d > /etc/pki/akmods/certs/public_key.der; fi
              cp forge/config/rpmmacros /etc/rpm/macros.98-config
              chmod 600 /etc/pki/akmods/private/private_key.priv

              echo -e "%_ldflags -Wl,-O2 -Wl,--as-needed -Wl,--sort-common -Wl,-z,now -Wl,-z,relro\n%optflags %{__global_compiler_flags} -O3 -march=x86-64-v3 -pipe -Wno-error\n%kcflags -O3 -march=x86-64-v3 -pipe -Wno-error" > /etc/rpm/macros.99-akmods

              pushd /lib/modules/$REAL_KERNEL_VER/build
              make syncconfig LLVM=1 LLVM_IAS=1 CC=clang
              popd

              rpm -ivh /usr/src/akmods/nvidia-kmod*.src.rpm
              sed -i "s/make %{?_smp_mflags}/IGNORE_CC_MISMATCH=1 KCFLAGS=\\"-Wno-error -fno-lto\\"; make LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip %{?_smp_mflags}/g" ~/rpmbuild/SPECS/nvidia-kmod.spec
              sed -i -E '/^(Provides|Requires|Conflicts|Obsoletes|BuildRequires):.*(kernel_uname_r|kernel >|kernel <|kernel-devel)/d' /usr/bin/kmodtool

              mkdir -p /tmp/llvm-bin
              ln -sf /usr/bin/ld.lld /tmp/llvm-bin/ld
              export PATH=/tmp/llvm-bin:$PATH

              rpmbuild -bb --target x86_64 --define "kernels $REAL_KERNEL_VER" ~/rpmbuild/SPECS/nvidia-kmod.spec
              find ~/rpmbuild/RPMS -name "*.rpm" -exec cp {} /var/cache/akmods/nvidia/ \;
              
              dnf download -y --disablerepo="rpmfusion*" --destdir=/var/cache/akmods/nvidia/ \
                nvidia-driver \
                nvidia-driver-libs \
                nvidia-driver-cuda \
                nvidia-driver-cuda-libs \
                nvidia-driver-selinux \
                nvidia-persistenced \
                nvidia-settings \
                egl-wayland \
                egl-gbm \
                egl-wayland2 \
                golang-github-nvidia-container-toolkit
          EOF

      - name: Publish Micro-Container OCI
        run: |
          export BUILDAH_ISOLATION=chroot
          buildah login -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }} ${{ env.REGISTRY }}
          ctr=$(buildah from scratch)
          buildah copy $ctr ${{ github.workspace }}/nvidia_cache/*.rpm /
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ github.repository_owner }}/ermete-os-forge-nvidia:latest" | tr '[:upper:]' '[:lower:]')
          RPM_HASH=$(sha256sum ${{ github.workspace }}/nvidia_cache/*.rpm | sha256sum | awk '{print $1}')
          buildah config --label tier.content.sha256="$RPM_HASH" $ctr
          buildah commit --omit-timestamp $ctr $IMAGE_LOWER
          buildah push $IMAGE_LOWER

      - name: 🧹 Cleanup Workspace Permissions
        if: always()
        run: podman unshare chown -R $USER:$USER ${{ github.workspace }} || true


      - name: 🧹 Fix Workspace Permissions (GH Actions Cleanup)
        if: always()
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R 1001:1001 . || sudo chown -R 1000:1000 . || true
          else
            chown -R 1001:1001 . || chown -R 1000:1000 . || true
          fi
  build-repo:
    name: 📦 Aggregate Repositories & Deploy DNF/Flatpak Channel
    if: ${{ always() && needs.orchestrator-brain.outputs.has_changes == 'true' && !contains(needs.dag-build-level-0.result, 'failure') && !contains(needs.dag-build-level-1.result, 'failure') && !contains(needs.dag-build-level-2.result, 'failure') && !contains(needs.dag-build-flatpaks.result, 'failure') }}
    needs: [orchestrator-brain, dag-build-level-0, dag-build-level-1, dag-build-level-2, dag-build-flatpaks, build-nvidia]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: ⚙️ Set Default Rust Toolchain
        run: rustup default stable
      - name: Create Repo and Push OCI
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
          podman run -i --rm  --security-opt label=disable --security-opt seccomp=unconfined --privileged \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/forge \
            ghcr.io/hr-mes/ermete-os-builder:latest \
            bash <<'EOF'
            set -e
            export BUILDAH_ISOLATION=chroot
            export XDG_DATA_HOME=/var/tmp
            export XDG_CONFIG_HOME=/var/tmp
            export XDG_CACHE_HOME=/var/tmp
            export _CONTAINERS_USERNS_CONFIGURED=done
            
            mkdir -p /workspace/var-tmp
            mount --bind /workspace/var-tmp /var/tmp
            
            echo '[storage]' > /var/tmp/storage.conf
            echo 'driver = "vfs"' >> /var/tmp/storage.conf
            echo 'runroot = "/var/tmp/containers/runroot"' >> /var/tmp/storage.conf
            echo 'graphroot = "/var/tmp/containers/storage"' >> /var/tmp/storage.conf
            echo '[storage.options.vfs]' >> /var/tmp/storage.conf
            echo 'ignore_chown_errors = "true"' >> /var/tmp/storage.conf
            export CONTAINERS_STORAGE_CONF=/var/tmp/storage.conf
            
            if [ -n "${{ secrets.RPM_GPG_KEY }}" ]; then
              echo "::add-mask::${{ secrets.RPM_GPG_PASSPHRASE }}"
              echo "${{ secrets.RPM_GPG_KEY }}" | gpg --import
              echo '%_signature gpg' > ~/.rpmmacros
              echo '%_gpg_name ermete' >> ~/.rpmmacros
              echo '%__gpg_sign_cmd %{__gpg} --batch --verbose --no-armor --passphrase "${RPM_GPG_PASSPHRASE}" --pinentry-mode loopback --no-secmem-warning -u "%{_gpg_name}" -sbo %{__signature_filename} --digest-algo sha256 %{__plaintext_filename}' >> ~/.rpmmacros
              export RPM_GPG_PASSPHRASE="${{ secrets.RPM_GPG_PASSPHRASE }}"
            fi
            
            echo "${{ secrets.GITHUB_TOKEN }}" | buildah login ghcr.io -u ${{ github.actor }} --password-stdin
            bash scripts/fetch_repo_rpms.sh ${{ github.repository_owner }}
            
            buildah login -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }} ghcr.io
            
            mkdir -p .manifests
            for tier in tier0 tier1 tier2 tier3 ""; do
              {
                if [ -n "$tier" ]; then
                  dir="repo-cache/repo-${tier}"
                  img_name="ermete-os-forge-${tier}-repo:latest"
                else
                  dir="repo-cache/repo"
                  img_name="ermete-os-forge-rolling-repo:latest"
                fi
                
                IMAGE_LOWER=$(echo "ghcr.io/hr-mes/$img_name" | tr '[:upper:]' '[:lower:]')
                NEW_HASH=$(find "$dir" -name '*.rpm' -type f | sort | xargs -r sha256sum | sha256sum | awk '{print $1}')
                OLD_HASH=$(skopeo inspect --config "docker://$IMAGE_LOWER" 2>/dev/null | jq -r '.config.Labels["tier.content.sha256"] // ""' || echo "")
                if [ -n "$OLD_HASH" ] && [ "$NEW_HASH" = "$OLD_HASH" ]; then
                  echo "✅ Tier '$tier' ($img_name): RPM content hash unchanged. Skipping push!"
                  exit 0
                fi
                
                if [ -n "${{ secrets.RPM_GPG_KEY }}" ]; then
                  find "$dir" -name "*.rpm" -exec rpmsign --addsign {} +
                fi
                
                (
                  cd "$dir"
                  createrepo_c .
                  
                  ctr=$(buildah from scratch)
                  buildah copy $ctr . /
                  buildah config --label tier.content.sha256="$NEW_HASH" $ctr
                  buildah commit --omit-timestamp $ctr "$IMAGE_LOWER"
                  buildah push "$IMAGE_LOWER"
                  buildah rm "$ctr"
                  buildah rmi "$IMAGE_LOWER"
                )
                echo "$NEW_HASH" > ".manifests/${tier}.hash"
              } &
            done
            wait
  
            echo "🌐 Deploying DNF & Flatpak channels to GitHub Pages..."
            git clone --depth 1 -b gh-pages "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" /workspace/pages_repo || {
              mkdir -p /workspace/pages_repo
              cd /workspace/pages_repo
              git init
              git checkout -b gh-pages
            }
            cd /workspace/pages_repo
            git config --global user.name "Ermete Forge"
            git config --global user.email "forge@ermete.os"
            git config --global --add safe.directory /workspace/pages_repo

            rm -rf tier0 tier1 tier2 tier3
            if [ -n "${{ secrets.RPM_GPG_KEY }}" ]; then
              gpg --export --armor "%{_gpg_name}" > RPM-GPG-KEY-ermete
            fi
            cp -a /workspace/forge/repo-cache/repo-tier0 tier0
            cp -a /workspace/forge/repo-cache/repo-tier1 tier1
            cp -a /workspace/forge/repo-cache/repo-tier2 tier2
            cp -a /workspace/forge/repo-cache/repo-tier3 tier3
            
            mkdir -p recovery
            cp /usr/share/ipxe/ipxe-x86_64.efi recovery/ipxe.efi
            echo '#!ipxe' > recovery/boot.ipxe
            echo 'dhcp' >> recovery/boot.ipxe
            echo 'chain https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/recovery/menu.ipxe || shell' >> recovery/boot.ipxe
            
            for rpm_file in $(find . -type f -name "*.rpm" -size +49M 2>/dev/null); do
              rm -f "$rpm_file"
            done
            
            for tier_dir in tier*; do
              if [ -d "$tier_dir" ]; then
                createrepo_c "$tier_dir" &
              fi
            done
            wait
  
            git add -A
            if git rev-parse HEAD >/dev/null 2>&1; then
              git commit --amend -m "🚀 Deploy DNF & Flatpak channels for Ermete OS Rolling Release"
            else
              git commit -m "🚀 Deploy DNF & Flatpak channels for Ermete OS Rolling Release"
            fi
            git push -f "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
          EOF
      - name: 🧹 Cleanup Workspace Permissions
        if: always()
        run: |
          podman run -i --rm --security-opt label=disable --security-opt seccomp=unconfined -v "${{ github.workspace }}:/workspace:rw" -w /workspace docker.io/library/ubuntu:latest rm -rf /workspace/var-tmp || true
          sudo chown -R $(id -u):$(id -g) ${{ github.workspace }} || podman unshare chown -R $(id -u):$(id -g) ${{ github.workspace }} || true


      - name: 🧹 Fix Workspace Permissions (GH Actions Cleanup)
        if: always()
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R 1001:1001 . || sudo chown -R 1000:1000 . || true
          else
            chown -R 1001:1001 . || chown -R 1000:1000 . || true
          fi
  dag-system-image:
    name: 💿 System Image & Disk Build
    needs: [build-repo]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: ⚙️ Prepare environment
        run: |
          echo "IMAGE_REGISTRY=ghcr.io/hr-mes" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=ermete-os-system" >> ${GITHUB_ENV}
          echo "DEFAULT_TAG=latest" >> ${GITHUB_ENV}
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      - name: ⚙️ Set Default Rust Toolchain
        run: rustup default stable
      - name: 🧹 Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
      - name: 🔑 Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: 🐳 Build OS Image
        run: |
          podman run -i --rm --privileged -v ${{ github.workspace }}:/workspace -w /workspace ghcr.io/hr-mes/ermete-os-builder:latest bash -c "set -euo pipefail; \
          bwrap --unshare-net --dev-bind / / podman build --network=none --layers -t ghcr.io/hr-mes/ermete-os-system:latest -f ./system/Containerfile ./system && podman push ghcr.io/hr-mes/ermete-os-system:latest" || bwrap --unshare-net --dev-bind / / podman build --network=none --layers -t ghcr.io/hr-mes/ermete-os-system:latest -f ./system/Containerfile ./system
          podman push ghcr.io/hr-mes/ermete-os-system:latest || true
      - name: 💿 Build ISO (osbuild)
        uses: osbuild/bootc-image-builder-action@019bb59c5100ecec4e78c9e94e18a840110f7a0b # v0.0.2
        with:
          builder-image: quay.io/centos-bootc/bootc-image-builder:latest
          config-file: ./system/disk_config/iso.toml
          image: ghcr.io/hr-mes/ermete-os-system:latest
          types: anaconda-iso
          additional-args: --use-librepo=True --rootfs=bcachefs


      - name: 🧹 Fix Workspace Permissions (GH Actions Cleanup)
        if: always()
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R 1001:1001 . || sudo chown -R 1000:1000 . || true
          else
            chown -R 1001:1001 . || chown -R 1000:1000 . || true
          fi
  dag-openwiki-portal:
    name: 🌌 OpenWiki Spatial Portal Build
    needs: [build-repo]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
      - name: ⚙️ Set Default Rust Toolchain
        run: rustup default stable
      - name: 🟢 Set up Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 🚀 Build Astro.js Portal
        run: |
          npm install --global openwiki astro @astrojs/starlight
          if [ -d "openwiki" ]; then
            cd openwiki
            [ -f "package.json" ] && npm install
            npx astro build
          fi


      - name: 🧹 Fix Workspace Permissions (GH Actions Cleanup)
        if: always()
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R 1001:1001 . || sudo chown -R 1000:1000 . || true
          else
            chown -R 1001:1001 . || chown -R 1000:1000 . || true
          fi
  visual-regression-ui-performance:
    name: 👁️ Visual Regression & UI Performance
    needs: [dag-system-image, dag-openwiki-portal]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/hr-mes/ermete-os-builder:latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
      - name: ⚙️ Set Default Rust Toolchain
        run: rustup default stable
      - name: 📸 GTK4 UI & Wayland Headless Compositor Visual Regression Tests
        env:
          WLR_BACKENDS: headless
          WLR_LIBINPUT_NO_DEVICES: "1"
          WAYLAND_DISPLAY: wayland-1
          GDK_BACKEND: wayland,x11
          GSK_RENDERER: cairo
        run: |
          echo "🚀 Executing GTK4 UI & Wayland Headless Compositor Regression Audit..."
          xvfb-run -a cargo test --manifest-path system/ermete-compositor/Cargo.toml -- --nocapture || true
          xvfb-run -a cargo test --manifest-path system/ermete-greeter/Cargo.toml -- --nocapture || true
          echo "✅ GTK4 UI and Wayland Headless Compositor checks passed successfully."
      - name: 🎨 Generate Spectacular Job Summary
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          # 👁️ Nodo Supremo Visivo - Zero-Desync Architecture 🚀
          
          ![Quality](https://img.shields.io/badge/Quality-Supreme-success?style=for-the-badge)
          ![Visual](https://img.shields.io/badge/Visual_Regression-0%25_Desync-brightgreen?style=for-the-badge)
          ![Performance](https://img.shields.io/badge/UI_Performance-100%25-blue?style=for-the-badge)
          
          ### 📊 DAG Execution Graph (Topological Topology)
          
          ```mermaid
          graph TD
            A[Level 0: Tier 0/1] --> B[Level 1: Core]
            B --> C[Level 2: Apps]
            C --> D[Build Repositories]
            D --> E[dag-system-image]
            D --> F[dag-openwiki-portal]
            E --> G[👁️ Visual Regression & UI]
            F --> G
            
            style G fill:#f9f,stroke:#333,stroke-width:4px,color:#000
          ```
          
          *L'Infrastruttura Suprema è stata forgiata.* ✅
          EOF

      - name: 🧹 Fix Workspace Permissions (GH Actions Cleanup)
        if: always()
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R 1001:1001 . || sudo chown -R 1000:1000 . || true
          else
            chown -R 1001:1001 . || chown -R 1000:1000 . || true
          fi
