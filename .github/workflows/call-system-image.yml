name: Call System Image (Reusable Workflow)

on:
  workflow_call:
    inputs:
      builder_content_hash:
        description: 'Content hash of the builder container image'
        required: true
        type: string
      has_changes:
        description: 'Flag indicating if repository changes were detected'
        required: false
        type: boolean
        default: true
    secrets:
      RPM_GPG_KEY:
        description: 'GPG key for RPM signing'
        required: false
      RPM_GPG_PASSPHRASE:
        description: 'Passphrase for GPG key'
        required: false

jobs:
  build-repo:
    name: 📦 Aggregate Repositories & Deploy DNF/Flatpak Channel
    if: ${{ inputs.has_changes }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: ⚙️ Set Default Rust Toolchain
        run: rustup default stable
      - name: ❄️ Install Nix (Bedrock Cache)
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - name: Create Repo and Push OCI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          EVENT_REPO_NAME: ${{ github.event.repository.name }}
          RPM_GPG_KEY: ${{ secrets.RPM_GPG_KEY }}
          RPM_GPG_PASSPHRASE: ${{ secrets.RPM_GPG_PASSPHRASE }}
          BUILDER_CONTENT_HASH: ${{ inputs.builder_content_hash }}
        run: |
          set -euo pipefail
          echo "${GITHUB_TOKEN}" | podman login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          podman run -i --rm  --security-opt label=disable --security-opt seccomp=unconfined --privileged \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace/forge \
            -e GITHUB_TOKEN="${GITHUB_TOKEN}" \
            -e GITHUB_ACTOR="${GITHUB_ACTOR}" \
            -e GITHUB_REPOSITORY_OWNER="${GITHUB_REPOSITORY_OWNER}" \
            -e GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            -e EVENT_REPO_NAME="${EVENT_REPO_NAME}" \
            -e RPM_GPG_KEY="${RPM_GPG_KEY}" \
            -e RPM_GPG_PASSPHRASE="${RPM_GPG_PASSPHRASE}" \
            "ghcr.io/hr-mes/ermete-os-builder:${BUILDER_CONTENT_HASH}" \
            bash <<'EOF'
            set -e
            export BUILDAH_ISOLATION=chroot
            export XDG_DATA_HOME=/var/tmp
            export XDG_CONFIG_HOME=/var/tmp
            export XDG_CACHE_HOME=/var/tmp
            export _CONTAINERS_USERNS_CONFIGURED=done
            
            mkdir -p /workspace/var-tmp
            mount --bind /workspace/var-tmp /var/tmp
            
            echo '[storage]' > /var/tmp/storage.conf
            echo 'driver = "vfs"' >> /var/tmp/storage.conf
            echo 'runroot = "/var/tmp/containers/runroot"' >> /var/tmp/storage.conf
            echo 'graphroot = "/var/tmp/containers/storage"' >> /var/tmp/storage.conf
            echo '[storage.options.vfs]' >> /var/tmp/storage.conf
            echo 'ignore_chown_errors = "true"' >> /var/tmp/storage.conf
            export CONTAINERS_STORAGE_CONF=/var/tmp/storage.conf
            
            if [ -n "${RPM_GPG_KEY}" ]; then
              echo "::add-mask::${RPM_GPG_PASSPHRASE}"
              echo "${RPM_GPG_KEY}" | gpg --import
              echo '%_signature gpg' > ~/.rpmmacros
              echo '%_gpg_name ermete' >> ~/.rpmmacros
              echo '%__gpg_sign_cmd %{__gpg} --batch --verbose --no-armor --passphrase "${RPM_GPG_PASSPHRASE}" --pinentry-mode loopback --no-secmem-warning -u "%{_gpg_name}" -sbo %{__signature_filename} --digest-algo sha256 %{__plaintext_filename}' >> ~/.rpmmacros
            fi
            
            echo "${GITHUB_TOKEN}" | buildah login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
            bash scripts/fetch_repo_rpms.sh "${GITHUB_REPOSITORY_OWNER}"
            
            echo "${GITHUB_TOKEN}" | buildah login -u "${GITHUB_ACTOR}" --password-stdin ghcr.io
            
            mkdir -p .manifests
            for tier in tier0 tier1 tier2 tier3 ""; do
              {
                if [ -n "$tier" ]; then
                  dir="repo-cache/repo-${tier}"
                  img_name="ermete-os-forge-${tier}-repo:latest"
                else
                  dir="repo-cache/repo"
                  img_name="ermete-os-forge-rolling-repo:latest"
                fi
                
                IMAGE_LOWER=$(echo "ghcr.io/hr-mes/$img_name" | tr '[:upper:]' '[:lower:]')
                NEW_HASH=$(find "$dir" -name '*.rpm' -type f | sort | xargs -r sha256sum | sha256sum | awk '{print $1}')
                OLD_HASH=$(skopeo inspect --config "docker://$IMAGE_LOWER" 2>/dev/null | jq -r '.config.Labels["tier.content.sha256"] // ""' || echo "")
                if [ -n "$OLD_HASH" ] && [ "$NEW_HASH" = "$OLD_HASH" ]; then
                  echo "✅ Tier '$tier' ($img_name): RPM content hash unchanged. Skipping push!"
                  exit 0
                fi
                
                if [ -n "${RPM_GPG_KEY}" ]; then
                  find "$dir" -name "*.rpm" -exec rpmsign --addsign {} +
                fi
                
                (
                  cd "$dir"
                  createrepo_c .
                  
                  ctr=$(buildah from scratch)
                  buildah copy $ctr . /
                  buildah config --label tier.content.sha256="$NEW_HASH" $ctr
                  buildah commit --omit-timestamp $ctr "$IMAGE_LOWER"
                  buildah push "$IMAGE_LOWER"
                  buildah rm "$ctr"
                  buildah rmi "$IMAGE_LOWER"
                )
                echo "$NEW_HASH" > ".manifests/${tier}.hash"
              } &
            done
            wait
  
            echo "🌐 Deploying DNF & Flatpak channels to GitHub Pages..."
            git clone --depth 1 -b gh-pages "https://${GITHUB_ACTOR}:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /workspace/pages_repo || {
              mkdir -p /workspace/pages_repo
              cd /workspace/pages_repo
              git init
              git checkout -b gh-pages
            }
            cd /workspace/pages_repo
            git config --global user.name "Ermete Forge"
            git config --global user.email "forge@ermete.os"
            git config --global --add safe.directory /workspace/pages_repo

            rm -rf tier0 tier1 tier2 tier3
            if [ -n "${RPM_GPG_KEY}" ]; then
              gpg --export --armor "%{_gpg_name}" > RPM-GPG-KEY-ermete
            fi
            cp -a /workspace/forge/repo-cache/repo-tier0 tier0
            cp -a /workspace/forge/repo-cache/repo-tier1 tier1
            cp -a /workspace/forge/repo-cache/repo-tier2 tier2
            cp -a /workspace/forge/repo-cache/repo-tier3 tier3
            
            mkdir -p recovery
            cp /usr/share/ipxe/ipxe-x86_64.efi recovery/ipxe.efi
            echo '#!ipxe' > recovery/boot.ipxe
            echo 'dhcp' >> recovery/boot.ipxe
            echo "chain https://${GITHUB_REPOSITORY_OWNER}.github.io/${EVENT_REPO_NAME}/recovery/menu.ipxe || shell" >> recovery/boot.ipxe
            
            for rpm_file in $(find . -type f -name "*.rpm" -size +49M 2>/dev/null); do
              rm -f "$rpm_file"
            done
            
            for tier_dir in tier*; do
              if [ -d "$tier_dir" ]; then
                createrepo_c "$tier_dir" &
              fi
            done
            wait
  
            git add -A
            if git rev-parse HEAD >/dev/null 2>&1; then
              git commit --amend -m "🚀 Deploy DNF & Flatpak channels for Ermete OS Rolling Release"
            else
              git commit -m "🚀 Deploy DNF & Flatpak channels for Ermete OS Rolling Release"
            fi
            git push -f "https://${GITHUB_ACTOR}:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          EOF
      - name: 🧹 Cleanup Workspace Permissions
        if: always()
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          podman run -i --rm --security-opt label=disable --security-opt seccomp=unconfined -v "${GITHUB_WORKSPACE}:/workspace:rw" -w /workspace docker.io/library/ubuntu:latest rm -rf /workspace/var-tmp || true
          sudo chown -R $(id -u):$(id -g) "${GITHUB_WORKSPACE}" || podman unshare chown -R $(id -u):$(id -g) "${GITHUB_WORKSPACE}" || true

      - name: 🧹 Fix Workspace Permissions (GH Actions Cleanup)
        if: always()
        run: |
          set -euo pipefail
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R 1001:1001 . || sudo chown -R 1000:1000 . || true
          else
            chown -R 1001:1001 . || chown -R 1000:1000 . || true
          fi

  dag-system-image:
    name: 💿 System Image & Disk Build
    needs: [build-repo]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: ⚙️ Prepare environment
        run: |
          set -euo pipefail
          echo "IMAGE_REGISTRY=ghcr.io/hr-mes" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=ermete-os-system" >> ${GITHUB_ENV}
          echo "DEFAULT_TAG=latest" >> ${GITHUB_ENV}
      - name: 📥 Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: ❄️ Install Nix (Bedrock Cache & Security Tools)
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - name: ⚙️ Set Default Rust Toolchain
        run: rustup default stable
      - name: 🧹 Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
      - name: 🔑 Login to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "${GITHUB_TOKEN}" | podman login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
      - name: 🐳 Build OS Image
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          BUILDER_CONTENT_HASH: ${{ inputs.builder_content_hash }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          podman run -i --rm --privileged -v "${GITHUB_WORKSPACE}:/workspace" -w /workspace "ghcr.io/hr-mes/ermete-os-builder:${BUILDER_CONTENT_HASH}" bash -c "set -euo pipefail; \
          bwrap --unshare-net --dev-bind / / podman build --network=none --layers -t ghcr.io/hr-mes/ermete-os-system:latest -t ghcr.io/hr-mes/ermete-os-system:${RUN_ID} -f ./system/Containerfile ./system && podman push ghcr.io/hr-mes/ermete-os-system:${RUN_ID}" || bwrap --unshare-net --dev-bind / / podman build --network=none --layers -t ghcr.io/hr-mes/ermete-os-system:latest -t ghcr.io/hr-mes/ermete-os-system:${RUN_ID} -f ./system/Containerfile ./system
          podman push ghcr.io/hr-mes/ermete-os-system:latest
          podman push ghcr.io/hr-mes/ermete-os-system:${RUN_ID} || true

      - name: 🔐 Sign & Attest OS Image (Zero-Trust Keyless Sigstore)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          echo "=== 🛡️ Initiating Keyless OIDC Signature & SBOM Attestation ==="
          # Authenticate Cosign
          nix run nixpkgs#cosign -- login ghcr.io -u "${GITHUB_ACTOR}" -p "${GITHUB_TOKEN}"
          
          # Generate SPDX SBOM from the final container
          echo "Generating Software Bill of Materials (SBOM)..."
          nix run nixpkgs#syft -- packages "ghcr.io/hr-mes/ermete-os-system:${RUN_ID}" -o spdx-json > system-sbom.spdx.json
          
          # Keyless Sign the container images
          echo "Signing OCI Artifacts..."
          nix run nixpkgs#cosign -- sign --yes "ghcr.io/hr-mes/ermete-os-system:${RUN_ID}"
          nix run nixpkgs#cosign -- sign --yes "ghcr.io/hr-mes/ermete-os-system:latest"
          
          # Attest the SBOM cryptographically
          echo "Attesting SBOM..."
          nix run nixpkgs#cosign -- attest --yes --type spdxjson --predicate system-sbom.spdx.json "ghcr.io/hr-mes/ermete-os-system:${RUN_ID}"
          nix run nixpkgs#cosign -- attest --yes --type spdxjson --predicate system-sbom.spdx.json "ghcr.io/hr-mes/ermete-os-system:latest"
          echo "✅ Final OS Image securely attested (SLSA Level 3)."

      - name: 💿 Build ISO (osbuild)
        uses: osbuild/bootc-image-builder-action@019bb59c5100ecec4e78c9e94e18a840110f7a0b # v0.0.2
        with:
          builder-image: quay.io/centos-bootc/bootc-image-builder:latest
          config-file: ./system/disk_config/iso.toml
          image: ghcr.io/hr-mes/ermete-os-system:${{ github.run_id }}
          types: anaconda-iso
          additional-args: --use-librepo=True --rootfs=bcachefs

      - name: 🧹 Fix Workspace Permissions (GH Actions Cleanup)
        if: always()
        run: |
          set -euo pipefail
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R 1001:1001 . || sudo chown -R 1000:1000 . || true
          else
            chown -R 1001:1001 . || chown -R 1000:1000 . || true
          fi

  dag-openwiki-portal:
    name: 🌌 OpenWiki Spatial Portal Build
    needs: [build-repo]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: ⚙️ Set Default Rust Toolchain
        run: rustup default stable
      - name: 🟢 Set up Node.js (v22)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: 🚀 Build Astro.js Portal
        run: |
          set -euo pipefail
          npm install --global openwiki astro @astrojs/starlight
          if [ -d "openwiki" ]; then
            cd openwiki
            [ -f "package.json" ] && npm install
            npx astro build
          fi

      - name: 🧹 Fix Workspace Permissions (GH Actions Cleanup)
        if: always()
        run: |
          set -euo pipefail
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R 1001:1001 . || sudo chown -R 1000:1000 . || true
          else
            chown -R 1001:1001 . || chown -R 1000:1000 . || true
          fi

  visual-regression-ui-performance:
    name: 👁️ Visual Regression & UI Performance
    needs: [dag-system-image, dag-openwiki-portal]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/hr-mes/ermete-os-builder:${{ inputs.builder_content_hash }}
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: ⚙️ Set Default Rust Toolchain
        run: rustup default stable
      - name: 📸 GTK4 UI & Wayland Headless Compositor Visual Regression Tests
        env:
          WLR_BACKENDS: headless
          WLR_LIBINPUT_NO_DEVICES: "1"
          WAYLAND_DISPLAY: wayland-1
          GDK_BACKEND: wayland,x11
          GSK_RENDERER: cairo
        run: |
          set -euo pipefail
          echo "🚀 Executing GTK4 UI & Wayland Headless Compositor Regression Audit..."
          xvfb-run -a cargo test --manifest-path system/ermete-compositor/Cargo.toml -- --nocapture
          xvfb-run -a cargo test --manifest-path system/ermete-greeter/Cargo.toml -- --nocapture
          echo "✅ GTK4 UI and Wayland Headless Compositor checks passed successfully."

      - name: 🧹 Fix Workspace Permissions (GH Actions Cleanup)
        if: always()
        run: |
          set -euo pipefail
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R 1001:1001 . || sudo chown -R 1000:1000 . || true
          else
            chown -R 1001:1001 . || chown -R 1000:1000 . || true
          fi
