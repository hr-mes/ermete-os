name: Reusable DAG Compile Workflow

on:
  workflow_call:
    inputs:
      dag_level_0:
        description: 'JSON array of DAG Level 0 packages'
        type: string
        required: false
        default: '[]'
      dag_level_1:
        description: 'JSON array of DAG Level 1 packages'
        type: string
        required: false
        default: '[]'
      dag_level_2:
        description: 'JSON array of DAG Level 2 packages'
        type: string
        required: false
        default: '[]'
      dag_flatpaks:
        description: 'JSON array of DAG Flatpak packages'
        type: string
        required: false
        default: '[]'
      builder_hash:
        description: 'Content hash of builder container'
        type: string
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  FEDORA_VERSION: 43
  SCCACHE_CACHE_SIZE: 10G

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  dag-build-level-0:
    if: inputs.dag_level_0 != '[]' && inputs.dag_level_0 != ''
    name: ⚡ DAG Level 0 Parallel Build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: forge
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        package: ${{ fromJson(inputs.dag_level_0) }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: ⚙️ Set Default Rust Toolchain
        run: rustup default stable
      - name: ❄️ Install Nix (Bedrock Cache)
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - name: Check Idempotency (GHCR Cache)
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG_NAME: ${{ matrix.package }}
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
          img_name="ermete-os-forge-${PKG_NAME}"
          if [ ! -d "specs/ermete-${PKG_NAME}" ] && [ ! -d "specs/${PKG_NAME}" ]; then
            img_name="ermete-os-forge-rolling-${PKG_NAME}"
          fi
          podman run -i --rm --security-opt label=disable --security-opt seccomp=unconfined --privileged -e GITHUB_TOKEN="${GITHUB_TOKEN}" -v ${{ github.workspace }}:/workspace -w /workspace/forge ghcr.io/hr-mes/ermete-os-builder:${{ inputs.builder_hash }} bash scripts/check_idempotency.sh --package "${PKG_NAME}" --registry ${{ env.REGISTRY }} --owner ${{ github.repository_owner }} --image-name "$img_name" > idemp.out
          source ./idemp.out
          echo "hash=$CONTENT_HASH" >> $GITHUB_OUTPUT
          if [ "$CACHE_HIT" = "true" ]; then echo "skip=true" >> $GITHUB_OUTPUT; else echo "skip=false" >> $GITHUB_OUTPUT; fi

      - name: Extreme Rust Cache (LLVM & Dependencies)
        if: steps.check.outputs.skip != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "sccache-level0-${{ matrix.package }}"
          cache-on-failure: "true"

      - name: Cache sccache
        if: steps.check.outputs.skip != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .sccache
          key: sccache-${{ matrix.package }}-${{ runner.os }}-${{ hashFiles(format('forge/specs/ermete-{0}/**', matrix.package)) }}
          restore-keys: |
            sccache-${{ matrix.package }}-

      - name: Build Package (Custom Spec or Upstream SRPM)
        if: steps.check.outputs.skip != 'true'
        env:
          PKG_NAME: ${{ matrix.package }}
          SCCACHE_CACHE_SIZE: 10G
        run: |
          set -euo pipefail
          mkdir -p RPMS
          mkdir -p ${{ github.workspace }}/.sccache
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
          
          PKG_CLEAN=$(echo "$PKG_NAME" | tr -cd '[:alnum:]-')
          SPEC_DIR=""
          if [ -d "forge/specs/ermete-${PKG_CLEAN}" ]; then SPEC_DIR="forge/specs/ermete-${PKG_CLEAN}"; elif [ -d "forge/specs/${PKG_CLEAN}" ]; then SPEC_DIR="forge/specs/${PKG_CLEAN}"; fi
          if [ -z "$SPEC_DIR" ]; then echo "DEBUG: PKG_NAME='$PKG_NAME' PKG_CLEAN='$PKG_CLEAN'"; ls -la forge/specs/; fi
          if [ -n "$SPEC_DIR" ]; then
            echo "📦 Compiling Custom Spec: $SPEC_DIR"
            podman run -i --rm \
              -e PKG_NAME="${PKG_NAME}" \
              -e SCCACHE_CACHE_SIZE="${SCCACHE_CACHE_SIZE}" \
              -v ${{ github.workspace }}:/workspace \
              -v ${{ github.workspace }}/.sccache:/root/.cache/sccache \
              -w /workspace/forge \
              ghcr.io/hr-mes/ermete-os-builder:${{ inputs.builder_hash }} \
              bash <<'EOF'
              cp config/rpmmacros ~/.rpmmacros
              mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
              PKG_CLEAN=$(echo "$PKG_NAME" | tr -cd '[:alnum:]-')
              SPEC_DIR=""
              if [ -d "specs/ermete-${PKG_CLEAN}" ]; then SPEC_DIR="specs/ermete-${PKG_CLEAN}"; elif [ -d "specs/${PKG_CLEAN}" ]; then SPEC_DIR="specs/${PKG_CLEAN}"; fi
            
              if [ -d "$SPEC_DIR/SOURCES" ]; then 
                cp -a $SPEC_DIR/SOURCES/* ~/rpmbuild/SOURCES/ || true
              fi

              for dir in $SPEC_DIR/*/ ; do
                if [ -d "$dir" ] && [ "$(basename "$dir")" != "SOURCES" ]; then
                  pkg_dir=$(basename "$dir")
                  tar -czf ~/rpmbuild/SOURCES/${pkg_dir}.tar.gz -C $SPEC_DIR ${pkg_dir}
                fi
              done
            
              mkdir -p ~/rpmbuild/BUILD/
              for spec_dir in /workspace/forge/specs/ermete-*/ /workspace/forge/specs/*/ ; do
                if [ -d "$spec_dir" ]; then
                  crate_name=$(basename "$spec_dir")
                  mkdir -p ~/rpmbuild/BUILD/"$crate_name"
                  cp -a "$spec_dir"/. ~/rpmbuild/BUILD/"$crate_name"/ 2>/dev/null || true
                fi
              done
   
                          
              rpmbuild -bb --nodeps $SPEC_DIR/*.spec
              mkdir -p /workspace/forge/RPMS
              cp ~/rpmbuild/RPMS/*/*.rpm /workspace/forge/RPMS/
          EOF
          else
            echo "❌ [MARTIAL LAW FATAL] Attempted to build upstream package ${PKG_NAME} without local spec! Dynamic downloads are strictly forbidden!"
            exit 1
          fi

      - name: Publish Micro-Container OCI
        if: steps.check.outputs.skip != 'true'
        env:
          PKG_NAME: ${{ matrix.package }}
        run: |
          set -euo pipefail
          export BUILDAH_ISOLATION=chroot
          echo "${{ secrets.GITHUB_TOKEN }}" | buildah login -u ${{ github.actor }} --password-stdin ${{ env.REGISTRY }}
          ctr=$(buildah from scratch)
          buildah copy $ctr RPMS/*.rpm /
          
          img_prefix="ermete-os-forge"
          if [ ! -d "specs/ermete-${PKG_NAME}" ] && [ ! -d "specs/${PKG_NAME}" ]; then
            img_prefix="ermete-os-forge-rolling"
          fi
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ github.repository_owner }}/${img_prefix}-${PKG_NAME}" | tr '[:upper:]' '[:lower:]')
          buildah config --label tier.content.sha256="${{ steps.check.outputs.hash }}" $ctr
          buildah commit --omit-timestamp $ctr $IMAGE_LOWER:latest
          buildah tag $IMAGE_LOWER:latest $IMAGE_LOWER:${{ steps.check.outputs.hash }}
          buildah push $IMAGE_LOWER:latest
          buildah push $IMAGE_LOWER:${{ steps.check.outputs.hash }}
          buildah rm $ctr || true

      - name: Generate SBOM (Syft)
        if: steps.check.outputs.skip != 'true'
        env:
          PKG_NAME: ${{ matrix.package }}
        run: |
          set -euo pipefail
          img_prefix="ermete-os-forge"
          if [ ! -d "specs/ermete-${PKG_NAME}" ] && [ ! -d "specs/${PKG_NAME}" ]; then
            img_prefix="ermete-os-forge-rolling"
          fi
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ github.repository_owner }}/${img_prefix}-${PKG_NAME}:latest" | tr "[:upper:]" "[:lower:]")
          nix run nixpkgs#syft -- packages $IMAGE_LOWER -o spdx-json=sbom-${PKG_NAME}.spdx.json

      - name: Sign & Attest Micro-Container
        if: steps.check.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG_NAME: ${{ matrix.package }}
        run: |
          set -euo pipefail
          nix run nixpkgs#cosign -- login ${{ env.REGISTRY }} -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
          img_prefix="ermete-os-forge"
          if [ ! -d "specs/ermete-${PKG_NAME}" ] && [ ! -d "specs/${PKG_NAME}" ]; then
            img_prefix="ermete-os-forge-rolling"
          fi
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ github.repository_owner }}/${img_prefix}-${PKG_NAME}:latest" | tr '[:upper:]' '[:lower:]')
          nix run nixpkgs#cosign -- sign --yes $IMAGE_LOWER
          nix run nixpkgs#cosign -- attest --yes --type spdxjson --predicate sbom-${PKG_NAME}.spdx.json $IMAGE_LOWER

      - name: 🛟 Upload Crash Artifacts (Nix/SCCache)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-logs-${{ matrix.package || matrix.flatpak }}
          path: |
            /tmp/nix-build*/
            RPMS/
            idemp.out

      - name: 🧹 Cleanup Workspace Permissions
        if: always()
        run: podman unshare chown -R $USER:$USER ${{ github.workspace }} || true

      - name: 🧹 Fix Workspace Permissions (GH Actions Cleanup)
        if: always()
        run: |
          set -euo pipefail
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R 1001:1001 . || sudo chown -R 1000:1000 . || true
          else
            chown -R 1001:1001 . || chown -R 1000:1000 . || true
          fi

  dag-build-level-1:
    needs: [dag-build-level-0]
