[package]
name = "ermete-agentic-kernel"
version = "1.0.0"
edition = "2021"
description = "Level 14 Autonomous Ring-0 Agentic OS Controller for Ermete OS"

[dependencies]
aya = "0.11"
tokio = { version = "1.37", features = ["full", "signal", "time"] }
zbus = "4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
bytes = "1.0"
libc = "0.2"
