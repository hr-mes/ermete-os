[package]
name = "ermete-cluster-mesh"
version = "1.0.0"
edition = "2021"
description = "Ermete OS Multi-Node Zero-Conf P2P Swarm Computing Daemon for Distributed NPU Inference"
authors = ["ermete-swarm-cluster-architect"]

[dependencies]
tokio = { workspace = true, features = ["full"] }
zbus = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
base64 = "0.21"
sha2 = { workspace = true }
tokio-util = { workspace = true, features = ["codec"] }
rand = { workspace = true }
