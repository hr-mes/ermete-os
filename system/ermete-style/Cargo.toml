[package]
name = "ermete-style"
version = "1.0.0"
edition = "2021"
description = "Centralized Glassmorphism, Accent Color Engine, and Appearance Layout System for Ermete OS"
authors = ["Ermete Architect <architect@ermete.os>"]

[dependencies]
gtk4 = { workspace = true }
gtk4-layer-shell = { workspace = true }
glib = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = "0.8"
zbus = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
