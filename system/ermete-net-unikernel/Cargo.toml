[package]
name = "ermete-net-unikernel"
version = "1.0.0"
edition = "2021"
description = "Ermete OS Userspace Zero-Copy Isolated Rust TCP/IP Stack Daemon (smoltcp + TUN/TAP / virtio-net bypass)"
authors = ["ermete-network-architect"]

[dependencies]
smoltcp = { version = "0.11", default-features = false, features = [
    "std",
    "log",
    "medium-ethernet",
    "proto-ipv4",
    "proto-ipv6",
    "proto-igmp",
    "socket-raw",
    "socket-icmp",
    "socket-udp",
    "socket-tcp",
    "socket-dhcpv4",
    "phy-tuntap_interface",
    "async"
] }
tokio = { version = "1.37", features = ["full"] }
nix = { version = "0.29", features = ["net", "fs", "ioctl", "process"] }
libc = "0.2"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
