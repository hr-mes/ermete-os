[package]
name = "ermete-net-unikernel"
version = "1.0.0"
edition = "2021"
description = "Ermete OS Userspace Zero-Copy Isolated Rust TCP/IP Stack Daemon (smoltcp + TUN/TAP / virtio-net bypass)"
authors = ["ermete-network-architect"]

[dependencies]
smoltcp = { version = "0.11", default-features = false, features = [
    "std",
    "log",
    "medium-ethernet",
    "proto-ipv4",
    "proto-ipv6",
    "proto-igmp",
    "socket-raw",
    "socket-icmp",
    "socket-udp",
    "socket-tcp",
    "socket-dhcpv4",
    "phy-tuntap_interface",
    "async"
] }
tokio = { workspace = true, features = ["full"] }
nix = { workspace = true, features = ["net", "fs", "ioctl", "process"] }
libc = { workspace = true }
anyhow = { workspace = true }
log = "0.4"
env_logger = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
ermete-bus-api = { path = "../ermete-bus-api" }

