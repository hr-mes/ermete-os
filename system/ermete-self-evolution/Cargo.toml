[package]
name = "ermete-self-evolution"
version = "1.0.0"
edition = "2021"
description = "Level 17 Autonomous Self-Evolving Code Graph & Runtime Recompilation Engine for Ermete OS"

[dependencies]
tokio = { version = "1.37", features = ["full", "signal", "time", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
zbus = "4.0"
libc = "0.2"
sha2 = "0.10"

