[package]
name = "ermete-hypervisor-daemon"
version = "1.0.0"
edition = "2021"
description = "Ermete OS Zero-Trust Hardware Micro-Hypervisor & Confidential Enclave Orchestrator"
authors = ["ermete-security-architect"]

[dependencies]
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
nix = { version = "0.29", features = ["fs", "ioctl", "process", "signal", "user"] }
libc = "0.2"
ring = "0.17"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.37", features = ["full"] }
zbus = "4.1"
tracing = "0.1"
tracing-subscriber = "0.3"
vmm-sys-util = "0.12"
pqc_dilithium = "0.2.0"
pqc_kyber = { version = "0.7.1", features = ["kyber1024"] }
