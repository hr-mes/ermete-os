[package]
name = "ermete-greeter"
version = "0.1.0"
edition = "2021"
description = "Ermete OS Zero-Trust Greeter and Key Release Manager replacing greetd"
authors = ["Greeter Security Architect <security@ermete.os>"]

[dependencies]
anyhow = { workspace = true }
log = "0.4"
env_logger = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
zbus = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
zeroize = { workspace = true, features = ["zeroize_derive"] }
gtk4 = { workspace = true, optional = true }
gtk4-layer-shell = { workspace = true, optional = true }
glib = { workspace = true, optional = true }

[features]
default = []
gtk = ["dep:gtk4", "dep:gtk4-layer-shell", "dep:glib"]
