[package]
name = "ermete-greeter"
version = "0.1.0"
edition = "2021"
description = "Ermete OS Zero-Trust Greeter and Key Release Manager replacing greetd"
authors = ["Greeter Security Architect <security@ermete.os>"]

[dependencies]
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.37", features = ["full"] }
zbus = "4.1"
tracing = "0.1"
sha2 = "0.10"
hex = "0.4"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
gtk4 = { version = "0.7", optional = true }
gtk4-layer-shell = { version = "0.2", optional = true }
glib = { version = "0.18", optional = true }

[features]
default = []
gtk = ["dep:gtk4", "dep:gtk4-layer-shell", "dep:glib"]
