[package]
name = "ermete-mesh-bus"
version = "1.0.0"
edition = "2021"
description = "Ermete OS Zero-Trust Post-Quantum Cryptography WireGuard P2P Mesh Bus Daemon"
authors = ["ermete-mesh-pqc-architect"]

[dependencies]
tokio = { workspace = true, features = ["full"] }
zbus = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
base64 = "0.21"
rand = { workspace = true }
rand_core = "0.10"
x25519-dalek = "2.0.1"
sha2 = { workspace = true }
ring = "0.17"
hex = { workspace = true }
ermete-bus-api = { path = "../ermete-bus-api" }
libc = { workspace = true }
zeroize = { workspace = true, features = ["zeroize_derive"] }
subtle = { workspace = true }



