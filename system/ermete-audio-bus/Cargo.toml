[package]
name = "ermete-audio-bus"
version = "1.0.0"
edition = "2021"
description = "Ermete OS Native Rust PipeWire Session Manager & Swarm Audio Routing Bus"
authors = ["ermete-audio-routing-architect"]

[dependencies]
tokio = { version = "1.37", features = ["full", "signal", "sync", "time"] }
zbus = "4.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
async-trait = "0.1"
rand = "0.8"
