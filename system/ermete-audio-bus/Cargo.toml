[package]
name = "ermete-audio-bus"
version = "1.0.0"
edition = "2021"
description = "Ermete OS Native Rust PipeWire Session Manager & Swarm Audio Routing Bus"
authors = ["ermete-audio-routing-architect"]

[dependencies]
tokio = { workspace = true, features = ["full", "signal", "sync", "time"] }
zbus = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
rand = { workspace = true }
