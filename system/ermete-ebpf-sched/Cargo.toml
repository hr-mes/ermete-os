[package]
name = "ermete-ebpf-sched"
version = "0.1.0"
edition = "2021"
description = "AI-Driven eBPF Kernel Scheduler Bridge (sched_ext & cgroup priority manager)"
build = "build.rs"


[dependencies]
tokio = { workspace = true, features = ["full", "signal", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
zbus = { workspace = true }
libc = { workspace = true }
aya = { workspace = true }

candle-core = "0.4.1"
