[package]
name = "ermete-ebpf-sched"
version = "0.1.0"
edition = "2021"
description = "AI-Driven eBPF Kernel Scheduler Bridge (sched_ext & cgroup priority manager)"

[dependencies]
tokio = { version = "1.37", features = ["full", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zbus = "4.0"
libc = "0.2"
aya = "0.11"
