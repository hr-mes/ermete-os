[package]
name = "ermete-kernel-forge"
version = "1.0.0"
edition = "2021"
description = "Gentoo-style Hardware-Tailored Kernel Forge Daemon for Ermete OS"

[dependencies]
tokio = { version = "1.37", features = ["full", "signal", "process"] }
zbus = "4.0"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
