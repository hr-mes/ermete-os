[package]
name = "ermete-compositor"
version = "0.1.0"
edition = "2021"
description = "Ermete OS Native AI-Driven Wayland Compositor (Smithay DRM/KMS & AI-Tiling IPC Engine)"
authors = ["ermete-compositor-architect"]

[dependencies]
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
zbus = { workspace = true }
futures-util = "0.3"
nix = { workspace = true, features = ["fs", "process", "signal"] }
smithay = { workspace = true, features = [
    "backend_drm",
    "backend_udev",
    "backend_egl",
    "backend_gbm",
    "backend_libinput",
    "backend_session",
    "renderer_gl",
    "wayland_frontend"
] }
wayland-server = { workspace = true }
glam = { workspace = true }
