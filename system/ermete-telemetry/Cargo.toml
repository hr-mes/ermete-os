[package]
name = "ermete-telemetry"
version = "1.0.0"
edition = "2021"
description = "Ermete OS AI Predictive Telemetry & Log-Aggregator Self-Healing Daemon"
authors = ["Predictive Telemetry Architect <telemetry@ermete.os>"]

[dependencies]
tokio = { version = "1.37", features = ["full"] }
tokio-stream = "0.1"
zbus = "4.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
