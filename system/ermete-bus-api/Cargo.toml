[package]
name = "ermete-bus-api"
version = "1.0.0"
edition = "2021"
description = "Shared Interface Crate and Common Types for Ermete OS Agentic Kernel and Mesh Bus"
authors = ["ermete-architect"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
zbus = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
libc = { workspace = true }
tracing = { workspace = true }
x25519-dalek = "2.0.1"
sha2 = { workspace = true }
hex = { workspace = true }
base64 = "0.21"
rand_core = "0.10"
rand = { workspace = true }
ring = "0.17"
zeroize = { workspace = true, features = ["zeroize_derive"] }
subtle = { workspace = true }

