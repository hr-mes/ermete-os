[package]
name = "ermete-init-oracle"
version = "1.0.0"
edition = "2021"
description = "Ermete OS Autonomous AI Systemd Init Oracle Daemon"
authors = ["ermete-init-oracle-architect"]

[dependencies]
tokio = { version = "1.37", features = ["full"] }
zbus = "4.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
regex = "1.10"

