[package]
name = "ermete-attestation"
version = "0.1.0"
edition = "2021"
description = "Ermete OS Confidential Computing Attestation Tool"
authors = ["ermete-kernel-developer"]

[dependencies]
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
nix = { version = "0.29", features = ["fs", "ioctl"] }
ring = "0.17"
sha2 = "0.10"
p384 = { version = "0.13", features = ["ecdsa"] }
p256 = { version = "0.13", features = ["ecdsa"] }
zeroize = { version = "1.8", features = ["zeroize_derive"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pqc_dilithium = "0.2.0"
pqc_kyber = { version = "0.7.1", features = ["kyber1024"] }


[workspace]
