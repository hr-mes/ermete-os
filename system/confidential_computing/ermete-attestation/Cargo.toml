[package]
name = "ermete-cvm-attestation"
version = "0.1.0"
edition = "2021"
description = "Ermete OS Confidential Computing Attestation Tool"
authors = ["ermete-kernel-developer"]

[dependencies]
anyhow = { workspace = true }
log = "0.4"
env_logger = { workspace = true }
nix = { workspace = true, features = ["fs", "ioctl"] }
ring = "0.17"
sha2 = { workspace = true }
p384 = { version = "0.13", features = ["ecdsa"] }
p256 = { version = "0.13", features = ["ecdsa"] }
zeroize = { workspace = true, features = ["zeroize_derive"] }
subtle = { workspace = true }
hex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
pqc_dilithium = { workspace = true }
pqc_kyber = { workspace = true, features = ["kyber1024"] }
tokio = { workspace = true, features = ["full"] }
zbus = { workspace = true }
tracing = { workspace = true }

