[package]
name = "ermete-ai-daemon"
version = "1.0.0"
edition = "2021"
description = "Ermete OS local AI daemon"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
candle-core = "0.3"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
