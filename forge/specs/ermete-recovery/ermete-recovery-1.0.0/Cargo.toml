[package]
name = "ermete-recovery"
version = "1.0.0"
edition = "2021"
authors = ["Ermete Forge <forge@ermete.os>"]
description = "Pre-Boot GUI Recovery Kiosk & Rollback Manager for Ermete OS"
license = "MIT"

[[bin]]
name = "ermete-recovery-ui"
path = "src/main.rs"

[dependencies]
gtk4 = { workspace = true }
relm4 = { workspace = true }
glib = { workspace = true }
tokio = { workspace = true, features = ["full"] }
zbus = { workspace = true, features = ["tokio"] }
libc = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
anyhow = { workspace = true }
ermete-style = { path = "../../../../system/ermete-style" }
zeroize = { workspace = true, features = ["zeroize_derive"] }
subtle = { workspace = true }


[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 1
panic = "abort"
