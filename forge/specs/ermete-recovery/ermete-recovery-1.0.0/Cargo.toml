[package]
name = "ermete-recovery"
version = "1.0.0"
edition = "2021"
authors = ["Ermete Forge <forge@ermete.os>"]
description = "Pre-Boot GUI Recovery Kiosk & Rollback Manager for Ermete OS"
license = "MIT"

[[bin]]
name = "ermete-recovery-ui"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.52.3", features = ["full"] }
zbus = { version = "5.17.0", features = ["tokio"] }
futures-util = "0.3.30"


