[package]
name = "ermete-dock"
version = "1.0.0"
edition = "2021"
authors = ["Ermete Forge <forge@ermete.os>"]
description = "Visual Dock and taskbar application logic for Ermete OS"

[dependencies]
gtk4 = "0.7"
gtk4-layer-shell = "0.2"
glib = "0.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.120"
notify = "6.1.1"
ermete-style = { path = "../../ermete-style" }
ermete-niri-ipc = { path = "../../ermete-niri-ipc" }
tokio = { version = "1.0", features = ["full"] }

