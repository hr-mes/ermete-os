[package]
name = "ermete-daemon-rs"
version = "0.2.1"
edition = "2021"

[dependencies]
mimalloc = { version = "0.1", default-features = false }
zbus = { version = "5.17.0", features = ["tokio"] }
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.120"
futures-util = "0.3.30"
libc = "0.2"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libloading = "0.8"
aya = { version = "0.11", default-features = false }

# Decoupled domain crates



