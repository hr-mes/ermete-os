[package]
name = "ermete-backup"
version = "1.0.0"
edition = "2021"
authors = ["Ermete Forge <forge@ermete.os>"]
description = "Instant Bcachefs Home Snapshot Manager & Time Machine GUI for Ermete OS"
license = "MIT"

[[bin]]
name = "ermete-backup-daemon"
path = "src/daemon.rs"


[dependencies]
dirs = "5.0"
glib = { workspace = true }
zbus = { workspace = true, features = ["tokio"] }
ermete-bus-api = { path = "../../../../system/ermete-bus-api" }
tokio = { workspace = true, features = ["full"] }
libc = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
chrono = "0.4"




[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 1
panic = "abort"
