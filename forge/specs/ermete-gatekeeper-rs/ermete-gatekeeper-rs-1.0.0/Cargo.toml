[package]
name = "ermete-gatekeeper-rs"
version = "1.0.0"
edition = "2021"

[lib]
name = "ermete_gatekeeper_rs"
path = "src/lib.rs"

[[bin]]
name = "ermete-gatekeeper-rs"
path = "src/main.rs"

[dependencies]
libc = { version = "0.2", default-features = false }
tokio = { version = "1.0", features = ["full"] }
zbus = "4.4.0"
xattr = "1.0"
gtk4 = "0.7.3"
pqc_dilithium = "0.2.0"


[features]
default = []
scudo_ffi = []
