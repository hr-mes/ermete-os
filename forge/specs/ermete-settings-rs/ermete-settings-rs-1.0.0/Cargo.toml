[package]
name = "ermete-settings-rs"
version = "1.0.0"
edition = "2021"
authors = ["Ermete Forge <forge@ermete.os>"]
description = "Pure Rust native System Settings for Ermete OS"

[dependencies]
mimalloc = { version = "0.1", default-features = false }
gtk4 = "0.7"
glib = "0.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.120"
zbus = "4.4.0"
tokio = { version = "1.28", features = ["full"] }
libc = "0.2.155"
relm4 = "0.7"
ermete-style = { path = "../../ermete-style" }
ermete-niri-ipc = { version = "0.1.0", path = "../../ermete-niri-ipc" }


