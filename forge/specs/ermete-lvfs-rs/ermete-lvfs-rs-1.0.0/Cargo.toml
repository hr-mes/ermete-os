[package]
name = "ermete-lvfs-rs"
version = "1.0.0"
edition = "2021"
description = "Ermete OS Firmware & LVFS Automation Daemon"

[dependencies]
mimalloc = { workspace = true }
tokio = { workspace = true, features = ["full"] }
zbus = { workspace = true }
ermete-bus-api = { path = "../../../../system/ermete-bus-api" }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }



[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 1
panic = "abort"
