[package]
name = "ermete-updater-rs"
version = "1.0.0"
edition = "2021"
description = "Ermete OS Over-The-Air Update Daemon"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
zbus = "4.4.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
