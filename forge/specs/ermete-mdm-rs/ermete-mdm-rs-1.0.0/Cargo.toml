[package]
name = "ermete-mdm-rs"
version = "1.0.0"
edition = "2021"
description = "Ermete OS Mobile Device Management (Anti-Theft & Remote Wipe)"

[dependencies]
mimalloc = { workspace = true }
tokio = { workspace = true, features = ["full"] }
zbus = { workspace = true }
ermete-bus-api = { path = "../../../../system/ermete-bus-api" }
libc = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }




[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 1
panic = "abort"
