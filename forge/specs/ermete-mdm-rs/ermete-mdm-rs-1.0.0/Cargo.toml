[package]
name = "ermete-mdm-rs"
version = "1.0.0"
edition = "2021"
description = "Ermete OS Mobile Device Management (Anti-Theft & Remote Wipe)"

[dependencies]
mimalloc = { version = "0.1", default-features = false }
tokio = { version = "1.36", features = ["full"] }
zbus = "4.4.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"


