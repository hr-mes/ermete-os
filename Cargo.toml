[workspace]
members = [
    "forge/specs/ermete-backup/ermete-backup-1.0.0",
    "forge/specs/ermete-cloud-rs/ermete-cloud-rs-1.0.0",
    "forge/specs/ermete-daemon-rs/ermete-daemon-rs-0.2.1",
    "forge/specs/ermete-dock/ermete-dock-1.0.0",
    "forge/specs/ermete-doctor/ermete-doctor-1.0.0",
    "forge/specs/ermete-gatekeeper-rs/ermete-gatekeeper-rs-1.0.0",
    "forge/specs/ermete-lvfs-rs/ermete-lvfs-rs-1.0.0",
    "forge/specs/ermete-mdm-rs/ermete-mdm-rs-1.0.0",
    "forge/specs/ermete-mesh-sync/ermete-mesh-sync-1.0.0",
    "forge/specs/ermete-recovery/ermete-recovery-1.0.0",
    "forge/specs/ermete-settings-rs/ermete-settings-rs-1.0.0",
    "forge/specs/ermete-shell-rs/ermete-shell-rs-1.0.0",
    "forge/specs/ermete-store-rs/ermete-store-rs-1.0.0",
    "forge/specs/ermete-sysmon-ebpf/ermete-sysmon-ebpf-1.0.0",
    "forge/specs/ermete-xdg-desktop-portal-ermete/xdg-desktop-portal-ermete-1.0.0",
    "forge/specs/ermete-ai-daemon/ermete-ai-daemon-1.0.0",
    "forge/specs/ermete-niri-ipc",
    "forge/specs/ermete-live-patcher/ermete-live-patcher-1.0.0",
    "system/confidential_computing/ermete-attestation",
    "system/ebpf/ebpf-core",
    "system/ebpf/ebpf-loader",
    "system/ermete-agentic-kernel",
    "system/ermete-audio-bus",
    "system/ermete-bus-api",
    "system/ermete-cluster-mesh",
    "system/ermete-compositor",
    "system/ermete-ebpf-sched",
    "system/ermete-greeter",
    "system/ermete-hypervisor-daemon",
    "system/ermete-init-oracle",
    "system/ermete-kernel-forge",
    "system/ermete-mesh-bus",
    "system/ermete-net-unikernel",
    "system/ermete-store",
    "system/ermete-telemetry",
    "system/ermete-oobe",
    "system/ermete-updater-rs"
]

exclude = [
    "tests/fuzz"
]

resolver = "2"

[workspace.dependencies]
# Async Runtime & Core Utilities
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.13", features = ["codec"] }
async-trait = "0.1.91"
futures-util = "0.3.30"
bytes = "1.10.1"
libc = "0.2.189"

# D-Bus & Inter-Process Communication
zbus = { version = "5.18.0", features = ["tokio"] }
notify-rust = "4.11"

# HTTP & Network Clients
reqwest = { version = "0.13.4", features = ["stream", "rustls", "json"] }

# GUI, Display & Wayland Ecosystem
gtk4 = "0.7.3"
gtk4-layer-shell = "0.2.0"
glib = "0.18.5"
relm4 = "0.7.1"
smithay = { version = "0.3.0", default-features = false }
wayland-server = "0.31.0"
wayland-client = "0.31.0"

# Serialization & Error Handling
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
anyhow = "1.0.99"

# Logging & Telemetry
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
log = "0.4.29"
env_logger = "0.11.11"

# Post-Quantum & Security Cryptography
pqc_kyber = "0.7.1"
pqc_dilithium = "0.2.0"
x25519-dalek = "2.0.1"
sha2 = "0.10.9"
hex = "0.4.3"
ring = "0.17.14"
zeroize = "1.8.1"
subtle = "2.6.1"

# eBPF / Kernel Instrumentation
aya = "0.13.1"

# System Utilities & CLI
glam = "0.29.0"
nix = "0.29.0"
clap = { version = "4.6.4", features = ["derive"] }
mimalloc = { version = "0.1.43", default-features = false }
rand = "0.8.5"

[profile.dev]
panic = "abort"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package.ermete-ai-daemon]
opt-level = 3
